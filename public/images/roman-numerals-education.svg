<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">دليل مبسط لرموز الأرقام الرومانية</title><desc id="desc">الرموز I V X L C D M وقيمها 1 و5 و10 و50 و100 و500 و1000، وأمثلة IV IX XL XC</desc>
<rect width="1200" height="630" fill="#f8fafc"/><rect x="36" y="36" width="1128" height="558" rx="36" fill="#102a43"/>
<text x="600" y="130" fill="#ffffff" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="52" font-weight="bold">الأرقام الرومانية</text>
<text x="600" y="176" fill="#bdd8eb" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="24">رموز أساسية وأمثلة على قاعدة الطرح</text>
<g font-family="Georgia,serif" text-anchor="middle" font-weight="bold">
<g fill="#ffffff" font-size="56"><text x="135" y="310">I</text><text x="285" y="310">V</text><text x="435" y="310">X</text><text x="585" y="310">L</text><text x="735" y="310">C</text><text x="885" y="310">D</text><text x="1035" y="310">M</text></g>
<g fill="#8ad9d0" font-size="33"><text x="135" y="366">1</text><text x="285" y="366">5</text><text x="435" y="366">10</text><text x="585" y="366">50</text><text x="735" y="366">100</text><text x="885" y="366">500</text><text x="1035" y="366">1000</text></g></g>
<path d="M78 419 H1122" stroke="#47627b" stroke-width="2"/>
<g font-family="Georgia,serif" text-anchor="middle" fill="#fef3c7" font-size="40"><text x="212" y="503">IV = 4</text><text x="480" y="503">IX = 9</text><text x="754" y="503">XL = 40</text><text x="1012" y="503">XC = 90</text></g>
</svg>
