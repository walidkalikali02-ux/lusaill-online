<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">الصيغة الأولية والصيغة الجزيئية</title><desc id="desc">التركيب النسبي يختلف عن عدد الذرات الفعلي؛ الحساب يحتاج معرفة الكتلة المولية للجزيء</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b2944"/><stop offset="1" stop-color="#165853"/></linearGradient></defs><rect width="1200" height="630" fill="#f1f6f8"/><rect x="30" y="25" width="1140" height="580" rx="35" fill="url(#bg)"/><text x="600" y="99" fill="#fff" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="43" font-weight="bold">الصيغة الأولية والصيغة الجزيئية</text><text x="600" y="143" fill="#bcdee2" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="23">التركيب النسبي يختلف عن عدد الذرات الفعلي</text><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle"><rect x="95" y="209" width="410" height="269" rx="26" fill="#d3f2e8"/><text x="300" y="264" font-size="28" fill="#15435a">الصيغة الأولية</text><text x="300" y="365" font-size="71" fill="#134053" font-weight="bold">CH₂O</text><text x="300" y="424" font-size="23" fill="#3b566b">النسبة 1 : 2 : 1</text><path d="M525 345H665" stroke="#e5f3f0" stroke-width="8"/><path d="M647 328L675 345L647 362" fill="none" stroke="#e5f3f0" stroke-width="8"/><rect x="696" y="209" width="410" height="269" rx="26" fill="#f7e5bf"/><text x="901" y="264" font-size="28" fill="#15435a">الصيغة الجزيئية</text><text x="901" y="365" font-size="67" fill="#134053" font-weight="bold">C₆H₁₂O₆</text><text x="901" y="424" font-size="23" fill="#3b566b">المضاعف = 6</text></g><text x="600" y="570" fill="#cfeced" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20">الحساب يحتاج معرفة الكتلة المولية للجزيء</text></svg>