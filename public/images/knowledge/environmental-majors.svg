<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">خريطة مسارات التخصصات البيئية</title><desc id="desc">خمسة مسارات بيئية هي المياه والطاقة والتنوع الحيوي والخرائط والصناعة، تربط المهارات العلمية بالعملية والرقمية</desc><rect width="1200" height="630" fill="#f3fbf5"/><rect x="30" y="29" width="1140" height="570" rx="33" fill="#123e35"/><text x="600" y="113" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="48" font-weight="bold" fill="#fff">التخصصات البيئية: خريطة المجالات</text><text x="600" y="162" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="24" fill="#c7f7d6">دراسة علمية، وهندسة، وبيانات، وتطبيقات ميدانية</text><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle"><rect x="63" y="228" width="200" height="205" rx="22" fill="#d9f5e9"/><rect x="282" y="228" width="200" height="205" rx="22" fill="#c6ecec"/><rect x="501" y="228" width="200" height="205" rx="22" fill="#ecf3cd"/><rect x="720" y="228" width="200" height="205" rx="22" fill="#ffebbc"/><rect x="939" y="228" width="200" height="205" rx="22" fill="#d9e7ff"/><g font-size="47"><text x="163" y="316">💧</text><text x="382" y="316">☀</text><text x="601" y="316">🌿</text><text x="820" y="316">◈</text><text x="1039" y="316">⚙</text></g><g font-size="27" font-weight="bold" fill="#123e35"><text x="163" y="377">المياه</text><text x="382" y="377">الطاقة</text><text x="601" y="377">التنوع</text><text x="820" y="377">الخرائط</text><text x="1039" y="377">الصناعة</text></g></g><text x="600" y="513" text-anchor="middle" fill="#ffffff" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="bold">مهارات مشتركة: القياس والتحليل والتواصل والسلامة</text><text x="600" y="557" text-anchor="middle" fill="#b3d9d0" font-family="Tahoma,Arial,sans-serif" font-size="21">اختر البرنامج وفق مقرراته واعتماده وبيانات بلدك</text></svg>