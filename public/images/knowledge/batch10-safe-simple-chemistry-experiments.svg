<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">تجارب كيمياء آمنة</title><desc id="desc">ذوبان وترشيح وكروماتوغرافيا وتبخر وامتزاج، وجميعها أنشطة منخفضة المخاطر بإشراف</desc><rect width="1200" height="630" fill="#eef6f9"/><rect x="26" y="24" width="1148" height="582" rx="34" fill="#14364a"/><text x="600" y="103" fill="#fff" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="44" font-weight="bold">تجارب كيمياء آمنة</text><text x="600" y="148" fill="#bfdfdd" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="23">خمس ملاحظات مع السلامة أولًا</text><rect x="66" y="204" width="329" height="131" rx="22" fill="#bde9eb"/><text x="230.5" y="262" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="bold" fill="#173b4b">ذوبان الملح</text><text x="230.5" y="305" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#284c57">محلول لا اختفاء مادة</text><rect x="435" y="204" width="329" height="131" rx="22" fill="#dfd8f9"/><text x="599.5" y="262" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="bold" fill="#173b4b">الترشيح</text><text x="599.5" y="305" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#284c57">فصل بعض الجسيمات</text><rect x="804" y="204" width="329" height="131" rx="22" fill="#f2e2b3"/><text x="968.5" y="262" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="bold" fill="#173b4b">الألوان</text><text x="968.5" y="305" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#284c57">كروماتوغرافيا مائية</text><rect x="251" y="352" width="329" height="131" rx="22" fill="#f1d8db"/><text x="415.5" y="410" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="bold" fill="#173b4b">التبخر</text><text x="415.5" y="453" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#284c57">عودة بلورات الملح</text><rect x="620" y="352" width="329" height="131" rx="22" fill="#d0ead4"/><text x="784.5" y="410" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="bold" fill="#173b4b">زيت وماء</text><text x="784.5" y="453" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#284c57">طبقتان غير ممتزجتين</text><text x="600" y="564" fill="#d8e9ee" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20">لا نار أو مذيبات أو خلط منظفات — ACS</text></svg>