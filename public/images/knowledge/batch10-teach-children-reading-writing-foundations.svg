<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">تأسيس القراءة والكتابة</title><desc id="desc">خمسة مستويات متكاملة من اللغة والأصوات والحروف والقراءة والكتابة</desc><rect width="1200" height="630" fill="#eef6f9"/><rect x="26" y="24" width="1148" height="582" rx="34" fill="#14364a"/><text x="600" y="103" fill="#fff" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="44" font-weight="bold">تأسيس القراءة والكتابة</text><text x="600" y="148" fill="#bfdfdd" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="23">من الوعي الصوتي إلى النص والمعنى</text><rect x="54" y="219" width="209" height="213" rx="22" fill="#bdece1"/><text x="158.5" y="277" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="bold" fill="#173b4b">اللغة</text><text x="158.5" y="320" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#284c57">حديث وقصص</text><rect x="273" y="219" width="209" height="213" rx="22" fill="#c4e3fa"/><text x="377.5" y="277" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="bold" fill="#173b4b">الأصوات</text><text x="377.5" y="320" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#284c57">تمييز ودمج</text><rect x="492" y="219" width="209" height="213" rx="22" fill="#f1e2b8"/><text x="596.5" y="277" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="bold" fill="#173b4b">الحروف</text><text x="596.5" y="320" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#284c57">ربط صوت ورمز</text><rect x="711" y="219" width="209" height="213" rx="22" fill="#e3d7f4"/><text x="815.5" y="277" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="bold" fill="#173b4b">قراءة</text><text x="815.5" y="320" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#284c57">فك وفهم</text><rect x="930" y="219" width="209" height="213" rx="22" fill="#f5dfde"/><text x="1034.5" y="277" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="bold" fill="#173b4b">كتابة</text><text x="1034.5" y="320" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#284c57">إملاء وتعبير</text><text x="600" y="564" fill="#d8e9ee" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20">التمرين يبدأ من مهارة الطفل ولا يقوم على الحفظ وحده</text></svg>