<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">هيكل التقرير العملي</title><desc id="d">مراحل إنشاء تقرير: تحديد الهدف، جمع الأدلة، عرض النتائج، مناقشتها، ثم تقديم التوصيات والمراجع.</desc><rect width="1200" height="630" fill="#f1f6fb"/><rect x="34" y="32" width="1132" height="566" rx="30" fill="#123149"/><text x="600" y="108" text-anchor="middle" fill="#ffffff" font-family="Tahoma,Arial,sans-serif" font-size="48" font-weight="bold">كيف تكتب تقريرًا واضحًا؟</text><text x="600" y="165" text-anchor="middle" fill="#bce7e0" font-family="Tahoma,Arial,sans-serif" font-size="25">الهدف ← الأدلة ← النتائج ← المناقشة ← التوصيات</text><g font-family="Tahoma,Arial,sans-serif" font-size="29" font-weight="bold" text-anchor="middle"><rect x="68" y="247" width="201" height="169" rx="22" fill="#c9f3ea"/><text x="168" y="345" fill="#123149">هدف محدد</text><rect x="285" y="247" width="201" height="169" rx="22" fill="#c6e5fd"/><text x="385" y="345" fill="#123149">أدلة موثقة</text><rect x="502" y="247" width="201" height="169" rx="22" fill="#f9e5bd"/><text x="602" y="345" fill="#123149">نتائج واضحة</text><rect x="719" y="247" width="201" height="169" rx="22" fill="#dcd6fb"/><text x="819" y="345" fill="#123149">مناقشة</text><rect x="936" y="247" width="201" height="169" rx="22" fill="#f7dce5"/><text x="1036" y="345" fill="#123149">توصيات</text></g><path d="M102 467H1098" stroke="#7ed2cb" stroke-width="5"/><text x="600" y="530" text-anchor="middle" fill="#d8eaf1" font-family="Tahoma,Arial,sans-serif" font-size="24">ميز بين الأرقام الواقعية والبيانات الافتراضية التعليمية</text></svg>