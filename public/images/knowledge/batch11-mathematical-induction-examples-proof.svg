<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">الاستقراء الرياضي</title><desc id="desc">مخطط البرهان الاستقرائي عبر الحالة الأساسية والفرض ثم إثبات القضية عند العدد التالي</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123a55"/><stop offset="1" stop-color="#0e554a"/></linearGradient></defs><rect width="1200" height="630" fill="#eef5f8"/><rect x="30" y="24" width="1140" height="582" rx="33" fill="url(#bg)"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle"><text x="600" y="101" font-size="43" fill="#fff" font-weight="bold">الاستقراء الرياضي</text><text x="600" y="146" font-size="24" fill="#cae5e7">أساس + انتقال من k إلى k+1</text></g><rect x="58" y="235" width="329" height="210" rx="24" fill="#c8ebde"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="222.5" y="295" font-size="27" font-weight="bold">الحالة الأساسية</text><text x="222.5" y="343" font-size="20">P(1) صحيحة</text></g><rect x="435" y="235" width="329" height="210" rx="24" fill="#c7e7f6"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="599.5" y="295" font-size="27" font-weight="bold">فرض الاستقراء</text><text x="599.5" y="343" font-size="20">نفترض P(k)</text></g><rect x="813" y="235" width="329" height="210" rx="24" fill="#f3dfbc"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="977.5" y="295" font-size="27" font-weight="bold">خطوة الانتقال</text><text x="977.5" y="343" font-size="20">نثبت P(k+1)</text></g><text x="600" y="563" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20" fill="#d6e9ec">من دون حالة أساس أو انتقال عام لا يكتمل البرهان</text></svg>