<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">ضغوط العمل: أسباب وحلول</title><desc id="desc">ضغط مهام وغموض دور يتحول إلى مراجعة عبء وموارد ثم حماية ودعم</desc><rect width="1200" height="630" fill="#eef6f9"/><rect x="26" y="24" width="1148" height="582" rx="34" fill="#14364a"/><text x="600" y="103" fill="#fff" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="44" font-weight="bold">ضغوط العمل: أسباب وحلول</text><text x="600" y="148" fill="#bfdfdd" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="23">التدخل التنظيمي قبل الاكتفاء بالنصائح الفردية</text><rect x="72" y="220" width="317" height="216" rx="22" fill="#f6ddd6"/><text x="230.5" y="278" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="bold" fill="#173b4b">عوامل الخطر</text><text x="230.5" y="321" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#284c57">عبء زائد / ضعف تحكم</text><rect x="443" y="220" width="317" height="216" rx="22" fill="#f4e4b6"/><text x="601.5" y="278" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="bold" fill="#173b4b">تدخل المؤسسة</text><text x="601.5" y="321" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#284c57">موارد / أولويات / حماية</text><rect x="814" y="220" width="317" height="216" rx="22" fill="#c8eee1"/><text x="972.5" y="278" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="bold" fill="#173b4b">المتابعة والدعم</text><text x="972.5" y="321" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#284c57">قياس وتحسين مستمران</text><path d="M395 327H432M767 327H804" stroke="#b8dcd9" stroke-width="7" stroke-linecap="round"/><text x="600" y="564" fill="#d8e9ee" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20">WHO: لا يُختزل الضغط النفسي في ضعف الموظف</text></svg>