<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">لماذا تتفاعل بعض المواد؟</title><desc id="desc">رسم مفاهيمي يبين طبيعة المواد ودرجة الحرارة والتركيز ومساحة السطح والمحفز وتأثيرها في معدل التفاعل</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123a55"/><stop offset="1" stop-color="#0e554a"/></linearGradient></defs><rect width="1200" height="630" fill="#eef5f8"/><rect x="30" y="24" width="1140" height="582" rx="33" fill="url(#bg)"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle"><text x="600" y="101" font-size="43" fill="#fff" font-weight="bold">لماذا تتفاعل بعض المواد؟</text><text x="600" y="146" font-size="24" fill="#cae5e7">طبيعة المادة والظروف تفسران السرعة</text></g><rect x="72" y="210" width="244" height="216" rx="24" fill="#bfece0"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="194" y="270" font-size="27" font-weight="bold">طبيعة المادة</text><text x="194" y="318" font-size="20">روابط وبنية</text></g><rect x="337" y="210" width="244" height="216" rx="24" fill="#f4ddb4"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="459" y="270" font-size="27" font-weight="bold">الحرارة</text><text x="459" y="318" font-size="20">طاقة التصادم</text></g><rect x="603" y="210" width="244" height="216" rx="24" fill="#c8e5f6"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="725" y="270" font-size="27" font-weight="bold">التركيز والسطح</text><text x="725" y="318" font-size="20">فرص التلامس</text></g><rect x="868" y="210" width="244" height="216" rx="24" fill="#ddd6f4"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="990" y="270" font-size="27" font-weight="bold">المحفز</text><text x="990" y="318" font-size="20">مسار أسرع</text></g><text x="600" y="563" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20" fill="#d6e9ec">إمكان التفاعل لا يعني سرعته؛ لا تخلط منظفات</text></svg>