<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">العوامل الخمسة لتكوّن التربة</title><desc id="desc">مخطط خمسة عوامل حول قطاع تربة متعدد الآفاق</desc><rect width="1200" height="630" fill="#eef6f9"/><rect x="26" y="24" width="1148" height="582" rx="34" fill="#14364a"/><text x="600" y="103" fill="#fff" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="44" font-weight="bold">العوامل الخمسة لتكوّن التربة</text><text x="600" y="148" fill="#bfdfdd" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="23">تفاعل المادة الأم والمناخ والكائنات والتضاريس والزمن</text><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle"><rect x="63" y="206" width="330" height="90" rx="21" fill="#d0e8f7"/><text x="228" y="263" font-size="27" fill="#16354c">المناخ</text><rect x="63" y="314" width="330" height="90" rx="21" fill="#d8ecdc"/><text x="228" y="371" font-size="27" fill="#16354c">الكائنات الحية</text><rect x="63" y="422" width="330" height="90" rx="21" fill="#f1dfb8"/><text x="228" y="479" font-size="27" fill="#16354c">المادة الأم</text><rect x="807" y="259" width="330" height="95" rx="21" fill="#e6daf6"/><text x="972" y="319" font-size="27" fill="#16354c">التضاريس</text><rect x="807" y="385" width="330" height="95" rx="21" fill="#f5dce0"/><text x="972" y="445" font-size="27" fill="#16354c">الزمن</text></g><g><rect x="445" y="205" width="308" height="78" fill="#8d6547"/><rect x="445" y="283" width="308" height="75" fill="#b98a5d"/><rect x="445" y="358" width="308" height="75" fill="#d7ad78"/><rect x="445" y="433" width="308" height="75" fill="#9a9da0"/></g><g fill="#fff" text-anchor="middle" font-size="24" font-family="Tahoma,Arial,sans-serif"><text x="598" y="252">أفق سطحي</text><text x="598" y="328">أفق متغير</text><text x="598" y="401">مواد أعمق</text><text x="598" y="480">مادة أم</text></g><text x="600" y="564" fill="#d8e9ee" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20">آفاق التربة ليست ثابتة العدد أو العمق في كل موقع</text></svg>