<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">مثال خريطة ذهنية للمذاكرة</title><desc id="d">الفكرة المركزية المذاكرة ترتبط بفروع فهم الموضوع، العلاقات، أمثلة، والاسترجاع الذاتي.</desc><rect width="1200" height="630" fill="#f4f9fa"/><rect x="30" y="30" width="1140" height="570" rx="28" fill="#123149"/><text x="600" y="99" text-anchor="middle" fill="#fff" font-family="Tahoma,Arial,sans-serif" font-size="45" font-weight="bold">خريطة ذهنية لفهم الدرس</text><g stroke="#9ce6dc" stroke-width="8" fill="none"><path d="M600 304 L313 215"/><path d="M600 304 L880 215"/><path d="M600 304 L313 436"/><path d="M600 304 L880 436"/></g><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-weight="bold"><rect x="445" y="242" width="310" height="123" rx="39" fill="#bee9dc"/><text x="600" y="310" fill="#123149" font-size="43">المذاكرة</text><rect x="126" y="155" width="273" height="111" rx="25" fill="#baddfa"/><text x="262" y="218" fill="#123149" font-size="29">الأفكار الرئيسية</text><rect x="793" y="155" width="273" height="111" rx="25" fill="#fbe7bc"/><text x="929" y="218" fill="#123149" font-size="29">العلاقات</text><rect x="126" y="388" width="273" height="111" rx="25" fill="#dfdafa"/><text x="262" y="451" fill="#123149" font-size="29">الأمثلة</text><rect x="793" y="388" width="273" height="111" rx="25" fill="#f5dce1"/><text x="929" y="451" fill="#123149" font-size="29">اختبر نفسك</text></g><text x="600" y="552" text-anchor="middle" fill="#d3e7ec" font-family="Tahoma,Arial,sans-serif" font-size="22">الرسم ينظم الأفكار لكنه لا يغني عن الاسترجاع وحل الأسئلة</text></svg>