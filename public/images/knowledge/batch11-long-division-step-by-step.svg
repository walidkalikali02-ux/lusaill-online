<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">القسمة المطولة خطوة بخطوة</title><desc id="desc">الخطوات الأساسية للقسمة المطولة: اقسم واضرب واطرح وأنزل ثم تحقق بالضرب</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123a55"/><stop offset="1" stop-color="#0e554a"/></linearGradient></defs><rect width="1200" height="630" fill="#eef5f8"/><rect x="30" y="24" width="1140" height="582" rx="33" fill="url(#bg)"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle"><text x="600" y="101" font-size="43" fill="#fff" font-weight="bold">القسمة المطولة خطوة بخطوة</text><text x="600" y="146" font-size="24" fill="#cae5e7">784 ÷ 7 = 112 — مثال محلول</text></g><rect x="61" y="228" width="244" height="193" rx="24" fill="#c7e9f5"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="183" y="288" font-size="27" font-weight="bold">اقسم</text><text x="183" y="336" font-size="20">7 ÷ 7 = 1</text></g><rect x="337" y="228" width="244" height="193" rx="24" fill="#d3ebdf"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="459" y="288" font-size="27" font-weight="bold">اضرب واطرح</text><text x="459" y="336" font-size="20">7 − 7 = 0</text></g><rect x="613" y="228" width="244" height="193" rx="24" fill="#f5e5b6"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="735" y="288" font-size="27" font-weight="bold">أنزل</text><text x="735" y="336" font-size="20">8 ثم 4</text></g><rect x="889" y="228" width="244" height="193" rx="24" fill="#e6d7f3"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="1011" y="288" font-size="27" font-weight="bold">تحقق</text><text x="1011" y="336" font-size="20">112 × 7 = 784</text></g><text x="600" y="563" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20" fill="#d6e9ec">خارج القسمة صحيح إذا تحقق المقسوم = المقسوم عليه × الخارج + الباقي</text></svg>