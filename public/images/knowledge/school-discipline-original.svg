<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">الانضباط المدرسي الإيجابي</title><desc id="desc">خطة تحسين تربوية خلال أربعة أسابيع. فهم المواقف، تعليم الروتين، تعزيز السلوك، مراجعة الإنصاف</desc><rect width="1200" height="630" fill="#f4f8fb"/><rect x="32" y="32" width="1136" height="566" rx="33" fill="#123149"/><text x="600" y="111" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="47" font-weight="bold" fill="#ffffff">الانضباط المدرسي الإيجابي</text><text x="600" y="166" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" fill="#a7e3dc">خطة تحسين تربوية خلال أربعة أسابيع</text><rect x="83" y="236" width="238" height="202" rx="24" fill="#d0f3ec"/><circle cx="202" cy="286" r="26" fill="#fff" opacity=".8"/><text x="202" y="299" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="30" font-weight="bold" fill="#15334d">1</text><text x="202" y="369" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="24" font-weight="bold" fill="#15334d">فهم المواقف</text><rect x="348" y="236" width="238" height="202" rx="24" fill="#c5e9fc"/><circle cx="467" cy="286" r="26" fill="#fff" opacity=".8"/><text x="467" y="299" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="30" font-weight="bold" fill="#15334d">2</text><text x="467" y="369" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="24" font-weight="bold" fill="#15334d">تعليم الروتين</text><rect x="613" y="236" width="238" height="202" rx="24" fill="#f3e4c7"/><circle cx="732" cy="286" r="26" fill="#fff" opacity=".8"/><text x="732" y="299" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="30" font-weight="bold" fill="#15334d">3</text><text x="732" y="369" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="24" font-weight="bold" fill="#15334d">تعزيز السلوك</text><rect x="878" y="236" width="238" height="202" rx="24" fill="#d8d0fa"/><circle cx="997" cy="286" r="26" fill="#fff" opacity=".8"/><text x="997" y="299" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="30" font-weight="bold" fill="#15334d">4</text><text x="997" y="369" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="24" font-weight="bold" fill="#15334d">مراجعة الإنصاف</text><path d="M110 476 H1090" stroke="#6bd0c1" stroke-width="4" stroke-linecap="round"/><text x="600" y="535" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="21" fill="#cfdeea">سلامة الطالب والعدالة تأتيان قبل العقوبة</text></svg>