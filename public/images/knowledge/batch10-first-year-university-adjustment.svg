<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">التكيف مع الحياة الجامعية</title><desc id="desc">أربع مراحل للتكيف الأكاديمي والاجتماعي والمالي</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e3049"/><stop offset="1" stop-color="#15544d"/></linearGradient></defs><rect width="1200" height="630" fill="#f1f6fa"/><rect x="24" y="24" width="1152" height="582" rx="32" fill="url(#bg)"/><text x="600" y="98" text-anchor="middle" fill="white" font-family="Tahoma,Arial,sans-serif" font-size="45" font-weight="bold">التكيف مع الحياة الجامعية</text><text x="600" y="145" text-anchor="middle" fill="#bce3df" font-family="Tahoma,Arial,sans-serif" font-size="23">خطة مرنة لأول أربعة أسابيع</text><rect x="63" y="211" width="254" height="254" rx="23" fill="#cae8f5"/><text x="190" y="271" fill="#163a50" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="28" font-weight="bold">الأسبوع 1</text><text x="190" y="316" fill="#284959" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="19">النظم والمقررات</text><rect x="334" y="211" width="254" height="254" rx="23" fill="#c1ebda"/><text x="461" y="271" fill="#163a50" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="28" font-weight="bold">الأسبوع 2</text><text x="461" y="316" fill="#284959" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="19">روتين الدراسة</text><rect x="605" y="211" width="254" height="254" rx="23" fill="#f5e2b9"/><text x="732" y="271" fill="#163a50" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="28" font-weight="bold">الأسبوع 3</text><text x="732" y="316" fill="#284959" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="19">مراجعة الأداء</text><rect x="876" y="211" width="254" height="254" rx="23" fill="#e0d7f4"/><text x="1003" y="271" fill="#163a50" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="28" font-weight="bold">الأسبوع 4</text><text x="1003" y="316" fill="#284959" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="19">تعديل الخطة</text><text x="600" y="567" text-anchor="middle" fill="#d2e9e7" font-family="Tahoma,Arial,sans-serif" font-size="20">التكيف عملية فردية ولا يوجد جدول نجاح واحد للجميع</text></svg>