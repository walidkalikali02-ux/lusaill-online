<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">الخطوات الخمس للقراءة المتعمقة SQ3R</title><desc id="desc">مخطط من خمس خطوات: استطلاع النص، طرح الأسئلة، القراءة النشطة، التسميع والاسترجاع، والمراجعة</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#132b4d"/><stop offset="1" stop-color="#12453e"/></linearGradient></defs><rect width="1200" height="630" fill="#f4f8fa"/><rect x="32" y="30" width="1136" height="568" rx="34" fill="url(#bg)"/><text x="600" y="111" text-anchor="middle" fill="#fff" font-family="Tahoma,Arial,sans-serif" font-size="48" font-weight="bold">القراءة المتعمقة في خمس خطوات</text><text x="600" y="162" text-anchor="middle" fill="#b6ddd8" font-family="Tahoma,Arial,sans-serif" font-size="25">SQ3R — سؤال وفهم واسترجاع ومراجعة</text><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle"><rect x="72" y="234" width="202" height="206" rx="24" fill="#c5f1e7"/><rect x="286" y="234" width="202" height="206" rx="24" fill="#c5e7fc"/><rect x="500" y="234" width="202" height="206" rx="24" fill="#f9e5bd"/><rect x="714" y="234" width="202" height="206" rx="24" fill="#e4ddfc"/><rect x="928" y="234" width="202" height="206" rx="24" fill="#f7dbe4"/><g font-size="47" font-weight="bold" fill="#11324b"><text x="173" y="316">S</text><text x="387" y="316">Q</text><text x="601" y="316">R</text><text x="815" y="316">R</text><text x="1029" y="316">R</text></g><g font-size="26" font-weight="bold" fill="#11324b"><text x="173" y="379">استطلاع</text><text x="387" y="379">اسأل</text><text x="601" y="379">اقرأ</text><text x="815" y="379">استرجع</text><text x="1029" y="379">راجع</text></g></g><path d="M104 485 H1096" stroke="#80cdc8" stroke-width="4"/><text x="600" y="539" text-anchor="middle" fill="#e9faf9" font-family="Tahoma,Arial,sans-serif" font-size="23">جرّب شرح الفكرة دون النظر للكتاب، ثم صحّح الفجوات</text></svg>