<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">كيف تختار الصديق الحقيقي؟</title><desc id="desc">مقارنة ثلاث سمات لصداقة صحية: الاحترام والثقة والتواصل وتقبل الحدود</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123a55"/><stop offset="1" stop-color="#0e554a"/></linearGradient></defs><rect width="1200" height="630" fill="#eef5f8"/><rect x="30" y="24" width="1140" height="582" rx="33" fill="url(#bg)"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle"><text x="600" y="101" font-size="43" fill="#fff" font-weight="bold">كيف تختار الصديق الحقيقي؟</text><text x="600" y="146" font-size="24" fill="#cae5e7">السلوك أهم من الشهرة والهدايا</text></g><rect x="88" y="230" width="310" height="223" rx="24" fill="#ceebdf"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="243" y="290" font-size="27" font-weight="bold">احترام الحدود</text><text x="243" y="338" font-size="20">قبول لا دون ضغط</text></g><rect x="446" y="230" width="310" height="223" rx="24" fill="#c5e4f8"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="601" y="290" font-size="27" font-weight="bold">بناء الثقة</text><text x="601" y="338" font-size="20">صدق وخصوصية</text></g><rect x="805" y="230" width="310" height="223" rx="24" fill="#f6e5bc"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="960" y="290" font-size="27" font-weight="bold">حل الخلاف</text><text x="960" y="338" font-size="20">استماع واعتذار</text></g><text x="600" y="563" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20" fill="#d6e9ec">الخلاف العابر ليس حكمًا قاطعًا؛ السلامة تأتي أولًا</text></svg>