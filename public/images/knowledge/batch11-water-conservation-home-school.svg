<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">ترشيد استهلاك المياه</title><desc id="desc">أربع مراحل لترشيد المياه في البيت والمدرسة مع الحفاظ على النظافة والصحة</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123a55"/><stop offset="1" stop-color="#0e554a"/></linearGradient></defs><rect width="1200" height="630" fill="#eef5f8"/><rect x="30" y="24" width="1140" height="582" rx="33" fill="url(#bg)"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle"><text x="600" y="101" font-size="43" fill="#fff" font-weight="bold">ترشيد استهلاك المياه</text><text x="600" y="146" font-size="24" fill="#cae5e7">ابدأ بالقياس والإصلاح ثم المقارنة</text></g><rect x="65" y="220" width="252" height="218" rx="24" fill="#c6e8fa"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="191" y="280" font-size="27" font-weight="bold">قياس الاستهلاك</text><text x="191" y="328" font-size="20">العداد والوحدات</text></g><rect x="340" y="220" width="252" height="218" rx="24" fill="#d0f0df"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="466" y="280" font-size="27" font-weight="bold">كشف التسرب</text><text x="466" y="328" font-size="20">الصيانة الآمنة</text></g><rect x="615" y="220" width="252" height="218" rx="24" fill="#f5dfb6"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="741" y="280" font-size="27" font-weight="bold">تقليل الهدر</text><text x="741" y="328" font-size="20">عادات وتجهيزات</text></g><rect x="890" y="220" width="252" height="218" rx="24" fill="#e5d6f4"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="1016" y="280" font-size="27" font-weight="bold">متابعة الأثر</text><text x="1016" y="328" font-size="20">فترة قابلة للمقارنة</text></g><text x="600" y="563" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20" fill="#d6e9ec">لا تُخفّض الماء اللازم للنظافة؛ الأرقام الفعلية تتطلب قياسًا</text></svg>