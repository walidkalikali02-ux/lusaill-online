<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">الدائرة النسبية: النسبة المئوية وزاوية القطاع</title><desc id="desc">دائرة مقسمة إلى أربعة قطاعات: العلوم 40%، الأدب 30%، التاريخ 20%، الفنون 10%، بتناسب صحيح ومجموع 360 درجة</desc><rect width="1200" height="630" fill="#f3f8fb"/><rect x="26" y="24" width="1148" height="582" rx="34" fill="#13334b"/><text x="600" y="102" text-anchor="middle" fill="#fff" font-family="Tahoma,Arial,sans-serif" font-size="46" font-weight="bold">كيف نرسم دائرة نسبية؟</text><text x="600" y="151" text-anchor="middle" fill="#bde8e2" font-family="Tahoma,Arial,sans-serif" font-size="26">الزاوية = قيمة الفئة ÷ المجموع × 360°</text><g transform="translate(272,357)"><circle r="175" fill="#ecf1f5"/><path d="M0 0 L0 -175 A175 175 0 0 1 102.862 141.578 Z" fill="#4db2a0"/><path d="M0 0 L102.862 141.578 A175 175 0 0 1 -166.434 54.078 Z" fill="#7bb7e4"/><path d="M0 0 L-166.434 54.078 A175 175 0 0 1 -102.862 -141.578 Z" fill="#f6c972"/><path d="M0 0 L-102.862 -141.578 A175 175 0 0 1 0 -175 Z" fill="#c7a4e4"/><circle r="175" fill="none" stroke="#fff" stroke-width="3"/></g><g font-family="Tahoma,Arial,sans-serif" font-size="27" fill="#fff"><rect x="560" y="208" width="32" height="32" rx="7" fill="#4db2a0"/><text x="614" y="235">العلوم: 20 من 50 = 40% = 144°</text><rect x="560" y="275" width="32" height="32" rx="7" fill="#7bb7e4"/><text x="614" y="302">الأدب: 15 من 50 = 30% = 108°</text><rect x="560" y="342" width="32" height="32" rx="7" fill="#f6c972"/><text x="614" y="369">التاريخ: 10 من 50 = 20% = 72°</text><rect x="560" y="409" width="32" height="32" rx="7" fill="#c7a4e4"/><text x="614" y="436">الفنون: 5 من 50 = 10% = 36°</text><text x="600" y="535" fill="#cfe6e9" text-anchor="middle" font-size="22">مجموع افتراضي للتعليم: 50 كتابًا — 100% = 360°</text></g></svg>