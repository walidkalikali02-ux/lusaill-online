<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">طلب اجتماع بالإنجليزي</title><desc id="desc">خمسة عناصر لبناء رسالة حجز اجتماع بالإنجليزية</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e3049"/><stop offset="1" stop-color="#15544d"/></linearGradient></defs><rect width="1200" height="630" fill="#f1f6fa"/><rect x="24" y="24" width="1152" height="582" rx="32" fill="url(#bg)"/><text x="600" y="98" text-anchor="middle" fill="white" font-family="Tahoma,Arial,sans-serif" font-size="45" font-weight="bold">طلب اجتماع بالإنجليزي</text><text x="600" y="145" text-anchor="middle" fill="#bce3df" font-family="Tahoma,Arial,sans-serif" font-size="23">هيكل رسالة رسمية واضحة</text><rect x="67" y="221" width="205" height="213" rx="23" fill="#c7e9f7"/><text x="169.5" y="281" fill="#163a50" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="28" font-weight="bold">Subject</text><text x="169.5" y="326" fill="#284959" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="19">عنوان محدد</text><rect x="283" y="221" width="205" height="213" rx="23" fill="#c8f1e6"/><text x="385.5" y="281" fill="#163a50" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="28" font-weight="bold">Purpose</text><text x="385.5" y="326" fill="#284959" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="19">سبب مختصر</text><rect x="499" y="221" width="205" height="213" rx="23" fill="#f8e7c3"/><text x="601.5" y="281" fill="#163a50" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="28" font-weight="bold">Time</text><text x="601.5" y="326" fill="#284959" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="19">خيارات ومدة</text><rect x="715" y="221" width="205" height="213" rx="23" fill="#e5dafa"/><text x="817.5" y="281" fill="#163a50" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="28" font-weight="bold">Confirm</text><text x="817.5" y="326" fill="#284959" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="19">طلب التأكيد</text><rect x="931" y="221" width="205" height="213" rx="23" fill="#f3dce7"/><text x="1033.5" y="281" fill="#163a50" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="28" font-weight="bold">Sign-off</text><text x="1033.5" y="326" fill="#284959" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="19">الاسم والوظيفة</text><text x="600" y="567" text-anchor="middle" fill="#d2e9e7" font-family="Tahoma,Arial,sans-serif" font-size="20">لا تعتبر الموعد مؤكدًا قبل قبول المتلقي</text></svg>