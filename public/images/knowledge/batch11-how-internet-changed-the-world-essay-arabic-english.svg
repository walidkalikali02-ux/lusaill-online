<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">كيف غيّر الإنترنت العالم؟</title><desc id="desc">مقارنة فرص الاتصال والتعلم والعمل مع مخاطر الخصوصية والمعلومات المضللة والفجوة الرقمية</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123a55"/><stop offset="1" stop-color="#0e554a"/></linearGradient></defs><rect width="1200" height="630" fill="#eef5f8"/><rect x="30" y="24" width="1140" height="582" rx="33" fill="url(#bg)"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle"><text x="600" y="101" font-size="43" fill="#fff" font-weight="bold">كيف غيّر الإنترنت العالم؟</text><text x="600" y="146" font-size="24" fill="#cae5e7">فرص جديدة وتحديات تحتاج تحققًا</text></g><rect x="88" y="207" width="481" height="272" rx="24" fill="#c3eddd"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="328.5" y="267" font-size="27" font-weight="bold">فرص الإنترنت</text><text x="328.5" y="315" font-size="20">اتصال • تعليم • عمل</text></g><rect x="631" y="207" width="481" height="272" rx="24" fill="#f2dfc3"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="871.5" y="267" font-size="27" font-weight="bold">تحديات الإنترنت</text><text x="871.5" y="315" font-size="20">خصوصية • معلومات • فجوة</text></g><text x="600" y="563" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20" fill="#d6e9ec">الأثر الحقيقي يعتمد على جودة الوصول والتصميم والثقة</text></svg>