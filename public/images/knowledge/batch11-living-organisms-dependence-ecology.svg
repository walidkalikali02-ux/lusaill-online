<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">كيف تعتمد الكائنات بعضها على بعض؟</title><desc id="desc">مخطط مبسط يبين منتجًا نباتيًا ومستهلِكًا ومفترسًا ومحللات مع انتقال الطاقة ودورات المادة</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123a55"/><stop offset="1" stop-color="#0e554a"/></linearGradient></defs><rect width="1200" height="630" fill="#eef5f8"/><rect x="30" y="24" width="1140" height="582" rx="33" fill="url(#bg)"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle"><text x="600" y="101" font-size="43" fill="#fff" font-weight="bold">كيف تعتمد الكائنات بعضها على بعض؟</text><text x="600" y="146" font-size="24" fill="#cae5e7">شبكات غذاء وتفاعل وتكافل</text></g><g stroke="#e0f1f0" stroke-width="6" fill="none"><path d="M271 340H410"/><path d="M551 340H690"/><path d="M830 340H963"/><path d="M807 435V475H260V435"/></g><rect x="70" y="238" width="242" height="200" rx="24" fill="#bde7be"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="191" y="298" font-size="27" font-weight="bold">نبات</text><text x="191" y="346" font-size="20">منتج</text></g><rect x="347" y="238" width="242" height="200" rx="24" fill="#f4e1b7"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="468" y="298" font-size="27" font-weight="bold">حشرة</text><text x="468" y="346" font-size="20">مستهلك أولي</text></g><rect x="624" y="238" width="242" height="200" rx="24" fill="#cee6f7"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="745" y="298" font-size="27" font-weight="bold">طائر</text><text x="745" y="346" font-size="20">مستهلك ثانوي</text></g><rect x="900" y="238" width="242" height="200" rx="24" fill="#e5d7f5"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="1021" y="298" font-size="27" font-weight="bold">محللات</text><text x="1021" y="346" font-size="20">عودة عناصر</text></g><text x="600" y="563" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20" fill="#d6e9ec">الطاقة تتدفق؛ المادة تدور، والمخطط مثال تعليمي</text></svg>