<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">التعلّم بالألعاب</title><desc id="d">صمّم النشاط لقياس التعلّم، لا لجمع النقاط فقط. حدد الهدف، صمّم التحدي، قدّم ملاحظات، اختبر الفهم</desc><rect width="1200" height="630" fill="#f0f6fa"/><rect x="25" y="24" width="1150" height="582" rx="35" fill="#102b46"/><text x="600" y="111" font-family="Tahoma,Arial,sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle">التعلّم بالألعاب</text><text x="600" y="167" font-family="Tahoma,Arial,sans-serif" font-size="27" fill="#b5ddd7" text-anchor="middle">صمّم النشاط لقياس التعلّم، لا لجمع النقاط فقط</text><rect x="62" y="240" width="245" height="219" rx="22" fill="#cdf0e4"/><circle cx="185" cy="298" r="31" fill="#ffffff" opacity=".88"/><text x="185" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="bold" fill="#12304e">◎</text><text x="185" y="382" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="bold" fill="#12304e">حدد الهدف</text><rect x="335" y="240" width="245" height="219" rx="22" fill="#c9ddfa"/><circle cx="458" cy="298" r="31" fill="#ffffff" opacity=".88"/><text x="458" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="bold" fill="#12304e">✦</text><text x="458" y="382" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="bold" fill="#12304e">صمّم التحدي</text><rect x="608" y="240" width="245" height="219" rx="22" fill="#fce5bc"/><circle cx="731" cy="298" r="31" fill="#ffffff" opacity=".88"/><text x="731" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="bold" fill="#12304e">✓</text><text x="731" y="382" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="bold" fill="#12304e">قدّم ملاحظات</text><rect x="881" y="240" width="245" height="219" rx="22" fill="#ead8f4"/><circle cx="1004" cy="298" r="31" fill="#ffffff" opacity=".88"/><text x="1004" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="bold" fill="#12304e">?</text><text x="1004" y="382" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="bold" fill="#12304e">اختبر الفهم</text><path d="M85 498h1030" stroke="#5ccfb7" stroke-width="4"/><text x="600" y="550" font-family="Tahoma,Arial,sans-serif" font-size="22" fill="#e2ebf2" text-anchor="middle">خطة صفية أصلية • أهداف واضحة • بديل ورقي • تقييم مستقل</text></svg>