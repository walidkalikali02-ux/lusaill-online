<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">كيف نقيّم البرهان القوي؟</title><desc id="desc">مقدمات موثقة واستدلال صحيح وحدود واضحة؛ البلاغة والثقة لا تكفيان لإثبات صحة النتيجة</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b2944"/><stop offset="1" stop-color="#165853"/></linearGradient></defs><rect width="1200" height="630" fill="#f1f6f8"/><rect x="30" y="25" width="1140" height="580" rx="35" fill="url(#bg)"/><text x="600" y="99" fill="#fff" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="43" font-weight="bold">كيف نقيّم البرهان القوي؟</text><text x="600" y="143" fill="#bcdee2" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="23">مقدمات موثقة واستدلال صحيح وحدود واضحة</text><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle"><rect x="92" y="217" width="283" height="107" rx="21" fill="#c5f3e5"/><text x="233" y="273" font-size="29" fill="#14334a" font-weight="bold">المقدمة الأولى</text><rect x="92" y="358" width="283" height="107" rx="21" fill="#c1e2f6"/><text x="233" y="412" font-size="29" fill="#14334a" font-weight="bold">المقدمة الثانية</text><path d="M392 341H547" stroke="#b8efdb" stroke-width="8" stroke-linecap="round"/><path d="M533 324L559 341L533 358" fill="none" stroke="#b8efdb" stroke-width="7"/><rect x="568" y="263" width="275" height="145" rx="23" fill="#f8e5b8"/><text x="706" y="322" font-size="29" fill="#14334a" font-weight="bold">الاستدلال</text><text x="706" y="365" font-size="22" fill="#36566c">صلة وصلاحية</text><path d="M855 341H921" stroke="#b8efdb" stroke-width="8"/><rect x="930" y="264" width="185" height="144" rx="24" fill="#e4d9fa"/><text x="1022" y="345" font-size="29" fill="#14334a" font-weight="bold">النتيجة</text><text x="592" y="498" fill="#e8f8fa" font-size="24">اختبر: الصدق + جودة المصدر + البدائل + القيود</text></g><text x="600" y="570" fill="#cfeced" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20">البلاغة والثقة لا تكفيان لإثبات صحة النتيجة</text></svg>