<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">مسارات تلوث المياه</title><desc id="desc">مسار ملوثات مياه من مصدر زراعي أو صرف إلى المجرى ثم المختبر والمعالجة</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e3049"/><stop offset="1" stop-color="#15544d"/></linearGradient></defs><rect width="1200" height="630" fill="#f1f6fa"/><rect x="24" y="24" width="1152" height="582" rx="32" fill="url(#bg)"/><text x="600" y="98" text-anchor="middle" fill="white" font-family="Tahoma,Arial,sans-serif" font-size="45" font-weight="bold">مسارات تلوث المياه</text><text x="600" y="145" text-anchor="middle" fill="#bce3df" font-family="Tahoma,Arial,sans-serif" font-size="23">من المصدر إلى الخطر ثم المعالجة</text><rect x="69" y="220" width="248" height="221" rx="23" fill="#f0dfb4"/><text x="193" y="280" fill="#163a50" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="28" font-weight="bold">مصدر تلوث</text><text x="193" y="325" fill="#284959" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="19">صرف / جريان</text><rect x="345" y="220" width="248" height="221" rx="23" fill="#cce6fa"/><text x="469" y="280" fill="#163a50" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="28" font-weight="bold">انتقال</text><text x="469" y="325" fill="#284959" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="19">سطح / جوف</text><rect x="621" y="220" width="248" height="221" rx="23" fill="#e3d8f2"/><text x="745" y="280" fill="#163a50" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="28" font-weight="bold">فحص المخاطر</text><text x="745" y="325" fill="#284959" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="19">نوع وتركيز</text><rect x="897" y="220" width="248" height="221" rx="23" fill="#c3ebda"/><text x="1021" y="280" fill="#163a50" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="28" font-weight="bold">إدارة ومعالجة</text><text x="1021" y="325" fill="#284959" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="19">مراقبة ووقاية</text><text x="600" y="567" text-anchor="middle" fill="#d2e9e7" font-family="Tahoma,Arial,sans-serif" font-size="20">صفاء الماء لا يثبت صلاحيته للشرب</text></svg>