<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">تحليل الاحتياجات التدريبية</title><desc id="desc">ثلاثة مستويات تحليل: المؤسسة والفريق والفرد ثم فجوة وتدخل وقياس</desc><rect width="1200" height="630" fill="#eef6f9"/><rect x="26" y="24" width="1148" height="582" rx="34" fill="#14364a"/><text x="600" y="103" fill="#fff" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="44" font-weight="bold">تحليل الاحتياجات التدريبية</text><text x="600" y="148" fill="#bfdfdd" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="23">تحديد فجوة قابلة للتحسين ثم اختبار أثرها</text><rect x="73" y="214" width="314" height="163" rx="22" fill="#d0e9f5"/><text x="230" y="272" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="bold" fill="#173b4b">المؤسسة</text><text x="230" y="315" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#284c57">استراتيجية ومخاطر</text><rect x="444" y="214" width="314" height="163" rx="22" fill="#cbefde"/><text x="601" y="272" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="bold" fill="#173b4b">الفريق</text><text x="601" y="315" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#284c57">عمليات ومهام</text><rect x="815" y="214" width="314" height="163" rx="22" fill="#f5e3ba"/><text x="972" y="272" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" font-weight="bold" fill="#173b4b">الفرد</text><text x="972" y="315" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="19" fill="#284c57">مهارة قابلة للملاحظة</text><path d="M229 390V424H600M600 390V424M972 390V424H600M600 424V441" fill="none" stroke="#a4dcd6" stroke-width="7"/><rect x="344" y="451" width="512" height="74" rx="20" fill="#e5d9f6"/><text x="600" y="498" text-anchor="middle" fill="#173b4b" font-family