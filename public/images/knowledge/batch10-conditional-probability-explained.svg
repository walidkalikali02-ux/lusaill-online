<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">الاحتمال المشروط</title><desc id="desc">مثال نرد عادل أكبر من ثلاثة: 4 و5 و6، والنواتج الزوجية 4 و6</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e3049"/><stop offset="1" stop-color="#15544d"/></linearGradient></defs><rect width="1200" height="630" fill="#f1f6fa"/><rect x="24" y="24" width="1152" height="582" rx="32" fill="url(#bg)"/><text x="600" y="98" text-anchor="middle" fill="white" font-family="Tahoma,Arial,sans-serif" font-size="45" font-weight="bold">الاحتمال المشروط</text><text x="600" y="145" text-anchor="middle" fill="#bce3df" font-family="Tahoma,Arial,sans-serif" font-size="23">غيّر المقام بحسب المجموعة المشترطة</text><g text-anchor="middle" font-family="Tahoma,Arial,sans-serif"><rect x="81" y="207" width="520" height="290" rx="28" fill="#cfedf0"/><text x="341" y="257" fill="#1c4052" font-size="29" font-weight="bold">الشرط B: الناتج أكبر من 3</text><g font-size="48" font-weight="bold"><circle cx="191" cy="362" r="53" fill="#55b9aa"/><circle cx="341" cy="362" r="53" fill="#f7d38e"/><circle cx="491" cy="362" r="53" fill="#55b9aa"/><text x="191" y="379" fill="#fff">4</text><text x="341" y="379" fill="#18394b">5</text><text x="491" y="379" fill="#fff">6</text></g><rect x="661" y="237" width="455" height="218" rx="29" fill="#f3e1b6"/><text x="888" y="301" fill="#17354c" font-size="32">P(زوجي | أكبر من 3)</text><text x="888" y="390" fill="#17354c" font-size="74" font-weight="bold">2 ÷ 3</text></g><text x="600" y="567" text-anchor="middle" fill="#d2e9e7" font-family="Tahoma,Arial,sans-serif" font-size="20">الشرط يغير فضاء العينة؛ لا تخلط بين A|B وB|A</text></svg>