<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">الخطوات الثماني للعملية البحثية</title><desc id="desc">ثماني محطات: المشكلة، السؤال، الخطة، البحث عن مصادر، تقييم الأدلة، جمع البيانات، التحليل، الكتابة والمراجعة</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102d45"/><stop offset="1" stop-color="#0b4c4b"/></linearGradient></defs><rect width="1200" height="630" fill="#f4f7fb"/><rect x="26" y="26" width="1148" height="578" rx="34" fill="url(#bg)"/><text x="600" y="94" text-anchor="middle" fill="#fff" font-family="Tahoma,Arial,sans-serif" font-size="48" font-weight="bold">العملية البحثية في ثماني محطات</text><text x="600" y="145" text-anchor="middle" fill="#c0e5e3" font-family="Tahoma,Arial,sans-serif" font-size="22">إطار تعليمي من لوسيل — يمكن الرجوع إلى الخطوات السابقة</text><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-weight="bold" font-size="22"><rect x="50" y="190" width="267" height="133" rx="21" fill="#d5f3e5"/><rect x="327" y="190" width="267" height="133" rx="21" fill="#c9e5fb"/><rect x="604" y="190" width="267" height="133" rx="21" fill="#fce9c7"/><rect x="881" y="190" width="267" height="133" rx="21" fill="#e6dafa"/><rect x="50" y="336" width="267" height="133" rx="21" fill="#f7dce6"/><rect x="327" y="336" width="267" height="133" rx="21" fill="#d5eafa"/><rect x="604" y="336" width="267" height="133" rx="21" fill="#d4efda"/><rect x="881" y="336" width="267" height="133" rx="21" fill="#f5e4be"/><g fill="#17364e"><text x="184" y="241" font-size="27">1</text><text x="184" y="290">تحديد المشكلة</text><text x="460" y="241" font-size="27">2</text><text x="460" y="290">سؤال البحث</text><text x="738" y="241" font-size="27">3</text><text x="738" y="290">الخطة والمنهج</text><text x="1015" y="241" font-size="27">4</text><text x="1015" y="290">البحث عن مصادر</text><text x="184" y="386" font-size="27">5</text><text x="184" y="437">تقييم المصادر</text><text x="460" y="386" font-size="27">6</text><text x="460" y="437">جمع الأدلة</text><text x="738" y="386" font-size="27">7</text><text x="738" y="437">تحليل النتائج</text><text x="1015" y="386" font-size="27">8</text><text x="1015" y="437">الكتابة والتوثيق</text></g></g><path d="M120 503H1080" stroke="#76d3c8" stroke-width="4" stroke-linecap="round"/><text x="600" y="552" text-anchor="middle" fill="#d7edec" font-family="Tahoma,Arial,sans-serif" font-size="22">المعلومات غير المدعومة تُراجع؛ لا تُختلق النتائج</text></svg>