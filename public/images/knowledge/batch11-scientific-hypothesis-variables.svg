<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">كيف تصوغ فرضية علمية؟</title><desc id="desc">خطوات اختبار الفرضية العلمية بعلاقة متغير مستقل ومتغير تابع مع ضبط عوامل أخرى</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123a55"/><stop offset="1" stop-color="#0e554a"/></linearGradient></defs><rect width="1200" height="630" fill="#eef5f8"/><rect x="30" y="24" width="1140" height="582" rx="33" fill="url(#bg)"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle"><text x="600" y="101" font-size="43" fill="#fff" font-weight="bold">كيف تصوغ فرضية علمية؟</text><text x="600" y="146" font-size="24" fill="#cae5e7">سؤال ← متغيرات ← اختبار ← أدلة</text></g><rect x="66" y="208" width="245" height="224" rx="24" fill="#bfe9e1"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="188.5" y="268" font-size="27" font-weight="bold">السؤال</text><text x="188.5" y="316" font-size="20">ماذا أريد تفسيره؟</text></g><rect x="336" y="208" width="245" height="224" rx="24" fill="#d0e6fb"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="458.5" y="268" font-size="27" font-weight="bold">المستقل</text><text x="458.5" y="316" font-size="20">ما العامل الذي يتغير؟</text></g><rect x="606" y="208" width="245" height="224" rx="24" fill="#f5e1b4"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="728.5" y="268" font-size="27" font-weight="bold">التابع</text><text x="728.5" y="316" font-size="20">ما الذي أقيسه؟</text></g><rect x="876" y="208" width="245" height="224" rx="24" fill="#dfd5f5"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="998.5" y="268" font-size="27" font-weight="bold">الاختبار</text><text x="998.5" y="316" font-size="20">قياس ومراجعة</text></g><text x="600" y="563" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20" fill="#d6e9ec">النتيجة الداعمة ليست إثباتًا نهائيًا لكل الظروف</text></svg>