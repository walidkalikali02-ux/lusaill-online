<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">العبور الوراثي في الطور التمهيدي الأول</title><desc id="desc">تبادل DNA بين كروماتيدات غير شقيقة؛ رسم مفاهيمي، وليس تصويرًا مجهرًا لكروموسومات حقيقية</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c2c49"/><stop offset="1" stop-color="#19554b"/></linearGradient></defs><rect width="1200" height="630" fill="#f4f8fb"/><rect x="28" y="26" width="1144" height="576" rx="33" fill="url(#bg)"/><text x="600" y="104" fill="#fff" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="43" font-weight="bold">العبور الوراثي في الطور التمهيدي الأول</text><text x="600" y="151" fill="#bce6e2" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="22">تبادل DNA بين كروماتيدات غير شقيقة</text><g stroke-width="24" stroke-linecap="round" fill="none"><path d="M280 222L435 448M435 222L280 448" stroke="#7dbdeb"/><path d="M590 222L745 448M745 222L590 448" stroke="#f6bd76"/><path d="M358 335L668 335" stroke="#e1f6f3" stroke-width="6" stroke-dasharray="18 11"/><path d="M280 222L435 448M435 222L280 448" stroke="#7dbdeb" opacity=".27"/><path d="M590 222L745 448M745 222L590 448" stroke="#f6bd76" opacity=".27"/></g><g fill="#fff" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="27"><text x="360" y="485">متماثل أول</text><text x="669" y="485">متماثل ثانٍ</text><text x="950" y="293">نقطة عبور</text><text x="950" y="347">وإعادة تركيب</text></g><path d="M762 340L848 327" stroke="#eaf7ec" stroke-width="5"/><text x="600" y="566" fill="#deeeee" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20">رسم مفاهيمي، وليس تصويرًا مجهرًا لكروموسومات حقيقية</text></svg>