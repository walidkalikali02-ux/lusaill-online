<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">كيف يتغير عدد السكان؟</title><desc id="desc">مخطط معادلة التغير السكاني بين فترتين</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e3049"/><stop offset="1" stop-color="#15544d"/></linearGradient></defs><rect width="1200" height="630" fill="#f1f6fa"/><rect x="24" y="24" width="1152" height="582" rx="32" fill="url(#bg)"/><text x="600" y="98" text-anchor="middle" fill="white" font-family="Tahoma,Arial,sans-serif" font-size="45" font-weight="bold">كيف يتغير عدد السكان؟</text><text x="600" y="145" text-anchor="middle" fill="#bce3df" font-family="Tahoma,Arial,sans-serif" font-size="23">المواليد والوفيات وصافي الهجرة</text><rect x="90" y="223" width="286" height="180" rx="23" fill="#bfe8e3"/><text x="233" y="283" fill="#163a50" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="28" font-weight="bold">المواليد − الوفيات</text><text x="233" y="328" fill="#284959" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="19">الزيادة الطبيعية</text> <rect x="456" y="223" width="286" height="180" rx="23" fill="#f2dfad"/><text x="599" y="283" fill="#163a50" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="28" font-weight="bold">الوافدون − المغادرون</text><text x="599" y="328" fill="#284959" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="19">صافي الهجرة</text> <rect x="823" y="223" width="286" height="180" rx="23" fill="#d8d1f2"/><text x="966" y="283" fill="#163a50" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="28" font-weight="bold">التغير الكلي</text><text x="966" y="328" fill="#284959" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-size="19">مجموع الأثرين</text><path d="M383 315H440M750 315H811" stroke="#e0f3f4" stroke-width="7" stroke-linecap="round"/><text x="600" y="482" fill="#fff" text-anchor="middle" font-size="26" font-family="Tahoma,Arial,sans-serif">تركيب الأعمار والتوزيع المكاني يغيران تفسير الأرقام</text><text x="600" y="567" text-anchor="middle" fill="#d2e9e7" font-family="Tahoma,Arial,sans-serif" font-size="20">المثال معادلة عامة، وليس توقعًا لدولة بعينها</text></svg>