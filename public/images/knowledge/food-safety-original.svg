<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">سلامة الغذاء في المنزل</title><desc id="desc">نظّف • افصل • اطهُ • برّد. غسل اليدين والأدوات، فصل النيئ عن الجاهز، ميزان حرارة للطهي، تبريد الطعام بسرعة</desc><rect width="1200" height="630" fill="#f4f8fb"/><rect x="32" y="32" width="1136" height="566" rx="33" fill="#123149"/><text x="600" y="111" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="47" font-weight="bold" fill="#ffffff">سلامة الغذاء في المنزل</text><text x="600" y="166" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" fill="#a7e3dc">نظّف • افصل • اطهُ • برّد</text><rect x="83" y="236" width="238" height="202" rx="24" fill="#b9e9d8"/><circle cx="202" cy="286" r="26" fill="#fff" opacity=".8"/><text x="202" y="299" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="30" font-weight="bold" fill="#15334d">1</text><text x="202" y="369" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="24" font-weight="bold" fill="#15334d">غسل اليدين والأدوات</text><rect x="348" y="236" width="238" height="202" rx="24" fill="#fee6b8"/><circle cx="467" cy="286" r="26" fill="#fff" opacity=".8"/><text x="467" y="299" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="30" font-weight="bold" fill="#15334d">2</text><text x="467" y="369" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="24" font-weight="bold" fill="#15334d">فصل النيئ عن الجاهز</text><rect x="613" y="236" width="238" height="202" rx="24" fill="#c4e5fa"/><circle cx="732" cy="286" r="26" fill="#fff" opacity=".8"/><text x="732" y="299" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="30" font-weight="bold" fill="#15334d">3</text><text x="732" y="369" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="24" font-weight="bold" fill="#15334d">ميزان حرارة للطهي</text><rect x="878" y="236" width="238" height="202" rx="24" fill="#f9d5d5"/><circle cx="997" cy="286" r="26" fill="#fff" opacity=".8"/><text x="997" y="299" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="30" font-weight="bold" fill="#15334d">4</text><text x="997" y="369" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="24" font-weight="bold" fill="#15334d">تبريد الطعام بسرعة</text><path d="M110 476 H1090" stroke="#6bd0c1" stroke-width="4" stroke-linecap="round"/><text x="600" y="535" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="21" fill="#cfdeea">الأرقام الحرارية تختلف حسب نوع الطعام — ارجع إلى جدول المصادر</text></svg>