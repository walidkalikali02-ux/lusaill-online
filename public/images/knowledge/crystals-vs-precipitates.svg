<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">الفرق بين التبلور والترسيب</title><desc id="desc">وعاء على اليمين يظهر بلورات منتظمة بعد تبخر الماء ووعاء على اليسار يظهر جزيئات راسب دقيقة تنتشر في محلول، مع أسهم توضيحية</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#092943"/><stop offset="1" stop-color="#163d52"/></linearGradient><linearGradient id="liq" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#6fdaeb" stop-opacity=".42"/><stop offset="1" stop-color="#0cb4b9" stop-opacity=".7"/></linearGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><text x="600" y="92" fill="#fff" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="48" font-weight="bold">كيف تتكوّن البلورات والرواسب؟</text><text x="600" y="137" fill="#b5dcdf" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="25">مقارنة تعليمية مبسطة — ليس تصويرًا مجهريًا حقيقيًا</text>
<g transform="translate(85,190)"><rect x="0" y="0" width="466" height="340" rx="25" fill="#e4fbfc" opacity=".09"/><text x="233" y="55" fill="#b6f3df" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="31" font-weight="bold">التبلور</text><path d="M100 105 L365 105 L341 285 Q330 316 305 316 L155 316 Q130 316 120 285 Z" fill="url(#liq)" stroke="#b9eff2" stroke-width="5"/><g stroke="#dcfbf3" stroke-width="3" fill="#8be7d8"><path d="M165 250l25-21 25 21v40h-50z"/><path d="M218 239l29-24 29 24v51h-58z"/><path d="M280 248l20-17 20 17v42h-40z"/></g><g fill="#c7ffff" opacity=".8"><circle cx="164" cy="185" r="5"/><circle cx="205" cy="167" r="5"/><circle cx="260" cy="198" r="5"/><circle cx="325" cy="174" r="5"/></g><text x="233" y="322" fill="#fff" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20">جسيمات تنتظم في بلورات</text></g>
<g transform="translate(648,190)"><rect x="0" y="0" width="466" height="340" rx="25" fill="#e4fbfc" opacity=".09"/><text x="233" y="55" fill="#ffe3a1" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="31" font-weight="bold">الترسيب</text><path d="M100 105 L365 105 L341 285 Q330 316 305 316 L155 316 Q130 316 120 285 Z" fill="url(#liq)" stroke="#b9eff2" stroke-width="5"/><g fill="#ffdb8f" opacity=".95"><circle cx="174" cy="162" r="10"/><circle cx="214" cy="194" r="7"/><circle cx="255" cy="173" r="14"/><circle cx="306" cy="209" r="8"/><circle cx="192" cy="232" r="9"/><circle cx="286" cy="248" r="10"/><circle cx="235" cy="269" r="8"/><circle cx="173" cy="285" r="5"/><circle cx="302" cy="284" r="8"/></g><path d="M132 294Q185 283 232 299T338 296L333 311H144Z" fill="#f8e6bb" opacity=".8"/><text x="233" y="322" fill="#fff" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20">جسيمات صلبة تظهر في المحلول</text></g><text x="600" y="581" fill="#b9d6e8" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="23">قد يكون الراسب بلوريًا أيضًا؛ الفرق في وصف العملية لا في الشكل فقط</text></svg>