<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">تصميم درس إبداعي في تسع مراحل</title><desc id="desc">التعرف على المتعلمين والأهداف والتقويم والمحتوى والمدخل والنشاط والمتابعة والتغذية الراجعة والتحسين</desc><rect width="1200" height="630" fill="#f4f8fa"/><rect x="28" y="28" width="1144" height="574" rx="32" fill="#112e49"/><text x="600" y="93" text-anchor="middle" fill="#fff" font-family="Tahoma,Arial,sans-serif" font-size="46" font-weight="bold">تصميم درس إبداعي في 9 مراحل</text><text x="600" y="139" text-anchor="middle" fill="#bce4e5" font-family="Tahoma,Arial,sans-serif" font-size="23">الهدف والتقويم والنشاط يجب أن يخدم بعضها بعضًا</text><g text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-weight="bold" fill="#13364b"><rect x="58" y="172" width="352" height="113" rx="19" fill="#d0f1e6"/><rect x="425" y="172" width="352" height="113" rx="19" fill="#c9e7fa"/><rect x="792" y="172" width="352" height="113" rx="19" fill="#fae7c5"/><rect x="58" y="297" width="352" height="113" rx="19" fill="#e1dcfa"/><rect x="425" y="297" width="352" height="113" rx="19" fill="#f6dfe5"/><rect x="792" y="297" width="352" height="113" rx="19" fill="#d5f0d9"/><rect x="58" y="422" width="352" height="113" rx="19" fill="#cce9f7"/><rect x="425" y="422" width="352" height="113" rx="19" fill="#eee3c6"/><rect x="792" y="422" width="352" height="113" rx="19" fill="#d8eef0"/><g font-size="25"><text x="234" y="221">1 — افهم المتعلمين</text><text x="601" y="221">2 — حدد الهدف</text><text x="968" y="221">3 — صمم التقييم</text><text x="234" y="346">4 — اختر المحتوى</text><text x="601" y="346">5 — افتح بسؤال</text><text x="968" y="346">6 — نشاط شامل</text><text x="234" y="471">7 — افحص الفهم</text><text x="601" y="471">8 — تغذية راجعة</text><text x="968" y="471">9 — حسّن الخطة</text></g></g><text x="600" y="570" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" fill="#d6e9ed">مخطط مفاهيمي أصلي — موسوعة لوسيل</text></svg>