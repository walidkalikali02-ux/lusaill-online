<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">عادات تدعم صحة المناعة</title><desc id="desc">خطوات واقعية لا وعود سحرية. غذاء متنوع، نوم منتظم، نشاط مناسب، لقاحات ووقاية</desc><rect width="1200" height="630" fill="#f4f8fb"/><rect x="32" y="32" width="1136" height="566" rx="33" fill="#123149"/><text x="600" y="111" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="47" font-weight="bold" fill="#ffffff">عادات تدعم صحة المناعة</text><text x="600" y="166" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="26" fill="#a7e3dc">خطوات واقعية لا وعود سحرية</text><rect x="83" y="236" width="238" height="202" rx="24" fill="#d6f3db"/><circle cx="202" cy="286" r="26" fill="#fff" opacity=".8"/><text x="202" y="299" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="30" font-weight="bold" fill="#15334d">1</text><text x="202" y="369" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="24" font-weight="bold" fill="#15334d">غذاء متنوع</text><rect x="348" y="236" width="238" height="202" rx="24" fill="#d1e4ff"/><circle cx="467" cy="286" r="26" fill="#fff" opacity=".8"/><text x="467" y="299" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="30" font-weight="bold" fill="#15334d">2</text><text x="467" y="369" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="24" font-weight="bold" fill="#15334d">نوم منتظم</text><rect x="613" y="236" width="238" height="202" rx="24" fill="#fae3c1"/><circle cx="732" cy="286" r="26" fill="#fff" opacity=".8"/><text x="732" y="299" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="30" font-weight="bold" fill="#15334d">3</text><text x="732" y="369" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="24" font-weight="bold" fill="#15334d">نشاط مناسب</text><rect x="878" y="236" width="238" height="202" rx="24" fill=