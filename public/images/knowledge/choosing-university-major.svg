<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">خمسة عوامل لاختيار التخصص الجامعي</title><desc id="desc">الاهتمام والقدرات وسوق العمل وجودة البرنامج ومرونة المسار؛ ليست درجة تنبؤ بالتوظيف</desc><rect width="1200" height="630" fill="#f8fafc"/><rect x="38" y="32" width="1124" height="566" rx="30" fill="#102a43"/><text x="600" y="119" fill="#fff" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-weight="bold" font-size="44">اختيار التخصص الجامعي: قرار مبني على الأدلة</text><text x="600" y="162" fill="#c6dce5" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="23">لا يكفي اسم التخصص أو الراتب المتوقع</text><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-weight="bold" font-size="27"><rect x="69" y="235" width="199" height="163" rx="24" fill="#d0f0e6"/><rect x="285" y="235" width="199" height="163" rx="24" fill="#c2e4f8"/><rect x="501" y="235" width="199" height="163" rx="24" fill="#f4e7ca"/><rect x="717" y="235" width="199" height="163" rx="24" fill="#dedbfb"/><rect x="933" y="235" width="199" height="163" rx="24" fill="#ffdde5"/><g fill="#102a43"><text x="169" y="301">الميول</text><text x="385" y="301">القدرات</text><text x="601" y="301">طلب السوق</text><text x="817" y="301">الجودة</text><text x="1033" y="301">المرونة</text></g><g font-size="19" font-weight="normal" fill="#37516a"><text x="169" y="354">طبيعة العمل</text><text x="385" y="354">مهارات التعلم</text><text x="601" y="354">بيانات محلية</text><text x="817" y="354">التكلفة والاعتماد</text><text x="1033" y="354">فرص التكيف</text></g></g><path d="M93 447H1107" stroke="#7ac9bc" stroke-width="5"/><text x="600" y="514" fill="#fff" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="28" font-weight="bold">قارن برنامجين باستخدام أداة التقييم التفاعلية</text><text x="600" y="556" fill="#b9d6e8" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="21">درجات التقييم لتنظيم التفكير فقط وليست توقعات مهنية</text></svg>