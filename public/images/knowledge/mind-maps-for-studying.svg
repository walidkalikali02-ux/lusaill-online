<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d"><title id="t">الخرائط الذهنية للمذاكرة</title><desc id="d">رتّب المفاهيم ثم اختبر قدرتك على تذكّرها. الفكرة المركزية، فروع رئيسية، روابط وأمثلة، استرجاع من الذاكرة</desc><rect width="1200" height="630" fill="#eff5fa"/><rect x="25" y="27" width="1150" height="576" rx="35" fill="#12314c"/><text x="600" y="110" text-anchor="middle" font-size="47" font-weight="bold" fill="#fff" font-family="Tahoma,Arial,sans-serif">الخرائط الذهنية للمذاكرة</text><text x="600" y="164" text-anchor="middle" font-size="25" fill="#bcebe4" font-family="Tahoma,Arial,sans-serif">رتّب المفاهيم ثم اختبر قدرتك على تذكّرها</text><rect x="56" y="244" width="247" height="198" rx="25" fill="#c6eadc"/><circle cx="180" cy="295" r="32" fill="#ffffff" opacity=".9"/><text x="180" y="307" fill="#14334c" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="35">1</text><text x="180" y="375" fill="#14334c" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-weight="bold" font-size="23">الفكرة المركزية</text><rect x="329" y="244" width="247" height="198" rx="25" fill="#c9dff6"/><circle cx="453" cy="295" r="32" fill="#ffffff" opacity=".9"/><text x="453" y="307" fill="#14334c" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="35">2</text><text x="453" y="375" fill="#14334c" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-weight="bold" font-size="23">فروع رئيسية</text><rect x="602" y="244" width="247" height="198" rx="25" fill="#fce6c9"/><circle cx="726" cy="295" r="32" fill="#ffffff" opacity=".9"/><text x="726" y="307" fill="#14334c" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="35">3</text><text x="726" y="375" fill="#14334c" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-weight="bold" font-size="23">روابط وأمثلة</text><rect x="875" y="244" width="247" height="198" rx="25" fill="#e6ddfc"/><circle cx="999" cy="295" r="32" fill="#ffffff" opacity=".9"/><text x="999" y="307" fill="#14334c" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="35">4</text><text x="999" y="375" fill="#14334c" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-weight="bold" font-size="23">استرجاع من الذاكرة</text><path d="M87 479H1113" stroke="#5dcebc" stroke-width="4"/><text x="600" y="539" text-anchor="middle" font-size="21" fill="#d9e8ef" font-family="Tahoma,Arial,sans-serif">لا تكتفِ بالتلوين؛ اختبر فهمك بأسئلة جديدة</text></svg>