<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">كيف يعمل تصنيف THE 2027؟</title><desc id="desc">أوزان الركائز الرسمية في تصنيف THE للجامعات 2027: جودة البحث 30% والتدريس 29.5% وبيئة البحث 29% والدولي 7.5% والصناعة 4%</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123a55"/><stop offset="1" stop-color="#0e554a"/></linearGradient></defs><rect width="1200" height="630" fill="#eef5f8"/><rect x="30" y="24" width="1140" height="582" rx="33" fill="url(#bg)"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle"><text x="600" y="101" font-size="43" fill="#fff" font-weight="bold">كيف يعمل تصنيف THE 2027؟</text><text x="600" y="146" font-size="24" fill="#cae5e7">17 مؤشرًا موزعة على خمس ركائز</text></g><g font-family="Tahoma,Arial,sans-serif" font-size="22" fill="#fff"><text x="225" y="231" text-anchor="end">جودة البحث</text><rect x="250" y="207" width="630" height="36" rx="8" fill="#6bd0b3"/><text x="900" y="232" fill="#fff">30%</text><text x="225" y="295" text-anchor="end">التدريس</text><rect x="250" y="271" width="619.5" height="36" rx="8" fill="#6db3ea"/><text x="889.5" y="296" fill="#fff">29.5%</text><text x="225" y="359" text-anchor="end">بيئة البحث</text><rect x="250" y="335" width="609" height="36" rx="8" fill="#f2ca78"/><text x="879" y="360" fill="#fff">29%</text><text x="225" y="423" text-anchor="end">الانفتاح الدولي</text><rect x="250" y="399" width="157.5" height="36" rx="8" fill="#d1a6eb"/><text x="427.5" y="424" fill="#fff">7.5%</text><text x="225" y="487" text-anchor="end">الصناعة</text><rect x="250" y="463" width="84" height="36" rx="8" fill="#ee91a7"/><text x="354" y="488" fill="#fff">4%</text></g><text x="600" y="563" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20" fill="#d6e9ec">هذه أوزان الإصدار العالمي العام 2027 وليست أحكامًا على كل برنامج</text></svg>