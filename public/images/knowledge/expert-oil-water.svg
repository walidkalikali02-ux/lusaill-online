<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">كيف نفصل الزيت عن الماء؟</title><desc id="desc">اختلاف الامتزاج والكثافة في المثال الشائع؛ الترشيح الورقي ليس بديلًا عامًا لقمع الفصل</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b2944"/><stop offset="1" stop-color="#165853"/></linearGradient></defs><rect width="1200" height="630" fill="#f1f6f8"/><rect x="30" y="25" width="1140" height="580" rx="35" fill="url(#bg)"/><text x="600" y="99" fill="#fff" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="43" font-weight="bold">كيف نفصل الزيت عن الماء؟</text><text x="600" y="143" fill="#bcdee2" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="23">اختلاف الامتزاج والكثافة في المثال الشائع</text><g stroke="#bbecf0" stroke-width="6"><path d="M205 210H505V471Q505 495 478 495H233Q205 495 205 469Z" fill="#ffffff" fill-opacity=".11"/></g><path d="M213 315H498V468Q498 488 476 488H235Q213 488 213 467Z" fill="#79bcde" opacity=".9"/><path d="M213 260H498V316H213Z" fill="#f7d07a" opacity=".95"/><path d="M498 286H645" stroke="#e5d092" stroke-width="4"/><text x="817" y="293" fill="#fff" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="29">زيت أعلى — كثافة أقل عادة</text><path d="M498 410H645" stroke="#8fcde9" stroke-width="4"/><text x="816" y="417" fill="#fff" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="29">ماء أسفل — طبقة منفصلة</text><text x="600" y="570" fill="#cfeced" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20">الترشيح الورقي ليس بديلًا عامًا لقمع الفصل</text></svg>