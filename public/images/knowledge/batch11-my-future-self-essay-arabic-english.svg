<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">كيف ترى نفسك في المستقبل؟</title><desc id="desc">هيكلة تعبير عربي وإنجليزي حول الطموحات والخطوات الواقعية</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123a55"/><stop offset="1" stop-color="#0e554a"/></linearGradient></defs><rect width="1200" height="630" fill="#eef5f8"/><rect x="30" y="24" width="1140" height="582" rx="33" fill="url(#bg)"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle"><text x="600" y="101" font-size="43" fill="#fff" font-weight="bold">كيف ترى نفسك في المستقبل؟</text><text x="600" y="146" font-size="24" fill="#cae5e7">فكرة شخصية + سبب + خطوة + مراجعة</text></g><rect x="74" y="235" width="237" height="191" rx="24" fill="#bfe8f3"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="192.5" y="295" font-size="27" font-weight="bold">أهتم بـ...</text><text x="192.5" y="343" font-size="20">موضوع واقعي</text></g><rect x="346" y="235" width="237" height="191" rx="24" fill="#c8f0dd"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="464.5" y="295" font-size="27" font-weight="bold">لأن...</text><text x="464.5" y="343" font-size="20">السبب والدافع</text></g><rect x="618" y="235" width="237" height="191" rx="24" fill="#f4e3b9"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="736.5" y="295" font-size="27" font-weight="bold">سأبدأ بـ...</text><text x="736.5" y="343" font-size="20">خطوة قابلة للتنفيذ</text></g><rect x="890" y="235" width="237" height="191" rx="24" fill="#dfd4f5"/><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" fill="#183b4d"><text x="1008.5" y="295" font-size="27" font-weight="bold">سأراجع...</text><text x="1008.5" y="343" font-size="20">التعلم والتعديل</text></g><text x="600" y="563" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20" fill="#d6e9ec">I hope to · I plan to · I might</text></svg>