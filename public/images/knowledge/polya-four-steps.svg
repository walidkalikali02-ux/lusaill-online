<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">الخطوات الأربع لحل المسألة وفق طريقة بوليا</title><desc id="desc">مخطط مراحل حل المسألة الرياضية من الفهم إلى التخطيط ثم التنفيذ والتحقق</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#103150"/><stop offset="1" stop-color="#163c43"/></linearGradient></defs><rect width="1200" height="630" fill="#f4f8fb"/><rect x="30" y="28" width="1140" height="574" rx="34" fill="url(#bg)"/><text x="600" y="101" fill="white" font-family="Tahoma,Arial,sans-serif" font-size="48" text-anchor="middle" font-weight="bold">حل المسألة الرياضية في 4 خطوات</text><text x="600" y="154" fill="#bbdbe7" font-family="Tahoma,Arial,sans-serif" font-size="24" text-anchor="middle">طريقة بوليا: لا تبدأ بالحساب قبل فهم السؤال</text><path d="M150 270 L1050 270" stroke="#82dad0" stroke-width="6" stroke-linecap="round"/><g text-anchor="middle" font-family="Tahoma,Arial,sans-serif"><g font-size="26" fill="#103150" font-weight="bold"><rect x="68" y="220" width="244" height="158" rx="24" fill="#bcefe3"/><text x="190" y="278">1 — افهم</text><text x="190" y="320" font-size="19" font-weight="normal">المعطيات والمطلوب</text><rect x="338" y="220" width="244" height="158" rx="24" fill="#c7e7fb"/><text x="460" y="278">2 — خطّط</text><text x="460" y="320" font-size="19" font-weight="normal">اختر استراتيجية</text><rect x="608" y="220" width="244" height="158" rx="24" fill="#fce4b8"/><text x="730" y="278">3 — نفّذ</text><text x="730" y="320" font-size="19" font-weight="normal">احسب ودوّن الخطوات</text><rect x="878" y="220" width="244" height="158" rx="24" fill="#e7d8fa"/><text x="1000" y="278">4 — تحقّق</text><text x="1000" y="320" font-size="19" font-weight="normal">اختبر النتيجة</text></g><path d="M1000 417 C1000 477 190 477 190 417" stroke="#86cbc5" stroke-width="4" stroke-dasharray="12 9" fill="none"/><text x="600" y="520" fill="#fff" font-size="25" font-weight="bold">إذا لم تنجح الخطة، عُد للفهم والتخطيط</text><text x="600" y="559" fill="#b9d9e4" font-size="19">رسم تعليمي أصلي — موسوعة لوسيل</text></g></svg>