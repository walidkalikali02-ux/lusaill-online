<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">الفرق بين الرقم والعدد</title><desc id="desc">507 عدد واحد يتكون من ثلاثة رموز عشرية؛ قيمة الرقم تتغير بحسب موقعه في النظام العشري</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c2c49"/><stop offset="1" stop-color="#19554b"/></linearGradient></defs><rect width="1200" height="630" fill="#f4f8fb"/><rect x="28" y="26" width="1144" height="576" rx="33" fill="url(#bg)"/><text x="600" y="104" fill="#fff" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="43" font-weight="bold">الفرق بين الرقم والعدد</text><text x="600" y="151" fill="#bce6e2" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="22">507 عدد واحد يتكون من ثلاثة رموز عشرية</text><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle"><g fill="#f6c57d"><rect x="98" y="235" width="287" height="195" rx="20"/><rect x="457" y="235" width="287" height="195" rx="20" fill="#add9eb"/><rect x="816" y="235" width="287" height="195" rx="20" fill="#c8e8db"/></g><g fill="#11394e" font-weight="bold"><text x="240" y="333" font-size="87">5</text><text x="601" y="333" font-size="87">0</text><text x="960" y="333" font-size="87">7</text><text x="240" y="396" font-size="27">المئات = 500</text><text x="601" y="396" font-size="27">العشرات = 0</text><text x="960" y="396" font-size="27">الآحاد = 7</text></g><text x="600" y="493" font-size="29" fill="#fff">507 = 500 + 0 + 7</text></g><text x="600" y="566" fill="#deeeee" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20">قيمة الرقم تتغير بحسب موقعه في النظام العشري</text></svg>