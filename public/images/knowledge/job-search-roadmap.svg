<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">خارطة البحث الآمن عن وظيفة</title><desc id="desc">خمس مراحل متصلة: تحديد المسار، تجهيز السيرة، البحث الآمن، التقديم والمقابلة، والمتابعة والتحقق من العرض</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102f4b"/><stop offset="1" stop-color="#164943"/></linearGradient></defs><rect width="1200" height="630" fill="#f5f9fc"/><rect x="30" y="28" width="1140" height="574" rx="32" fill="url(#bg)"/><text x="600" y="104" fill="white" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="45" font-weight="bold">خطة عملية للبحث عن وظيفة</text><text x="600" y="154" fill="#b5e3df" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="24">من تحديد المسار إلى تقييم العرض والتحقق من الشركة</text><g text-anchor="middle" font-family="Tahoma,Arial,sans-serif" fill="#13364b"><rect x="65" y="218" width="207" height="210" rx="24" fill="#d4f2e7"/><rect x="281" y="218" width="207" height="210" rx="24" fill="#c7e5fc"/><rect x="497" y="218" width="207" height="210" rx="24" fill="#fae5bf"/><rect x="713" y="218" width="207" height="210" rx="24" fill="#e4dafa"/><rect x="929" y="218" width="207" height="210" rx="24" fill="#f6dce3"/><g font-weight="bold"><text x="169" y="285" font-size="44">1</text><text x="385" y="285" font-size="44">2</text><text x="601" y="285" font-size="44">3</text><text x="817" y="285" font-size="44">4</text><text x="1033" y="285" font-size="44">5</text><text x="169" y="343" font-size="25">حدد هدفك</text><text x="385" y="343" font-size="25">جهز السيرة</text><text x="601" y="343" font-size="25">ابحث بأمان</text><text x="817" y="343" font-size="25">قدم واستعد</text><text x="1033" y="343" font-size="25">تابع وتحقق</text></g><g font-size="18"><text x="169" y="386">المهارات والأدوار</text><text x="385" y="386">إنجازات حقيقية</text><text x="601" y="386">مصدر رسمي</text><text x="817" y="386">متطلبات ومقابلة</text><text x="1033" y="386">الطلبات والعرض</text></g></g><path d="M109 471H1091" stroke="#80cec7" stroke-width="4"/><text x="600" y="536" text-anchor="middle" fill="#e0f2f0" font-family="Tahoma,Arial,sans-serif" font-size="24">لا تدفع مالًا مقابل وعد بوظيفة — تحقق من الجهة قبل مشاركة بياناتك</text></svg>