<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">تدفق الطاقة في النظام البيئي</title><desc id="desc">هرم طاقة تعليمي بفرض كفاءة انتقال 10%؛ قاعدة 10% تقريب تعليمي وليست كفاءة ثابتة للطبيعة</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c2c49"/><stop offset="1" stop-color="#19554b"/></linearGradient></defs><rect width="1200" height="630" fill="#f4f8fb"/><rect x="28" y="26" width="1144" height="576" rx="33" fill="url(#bg)"/><text x="600" y="104" fill="#fff" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="43" font-weight="bold">تدفق الطاقة في النظام البيئي</text><text x="600" y="151" fill="#bce6e2" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="22">هرم طاقة تعليمي بفرض كفاءة انتقال 10%</text><g font-family="Tahoma,Arial,sans-serif" text-anchor="middle" font-weight="bold"><path d="M240 478L960 478L888 402H312Z" fill="#83caa2"/><path d="M312 394H888L799 321H401Z" fill="#a4d9b4"/><path d="M401 313H799L709 239H491Z" fill="#e6d18e"/><path d="M491 231H709L600 172Z" fill="#f4ad85"/><g fill="#143949"><text x="600" y="454" font-size="29">منتجون — 10,000</text><text x="600" y="371" font-size="26">مستهلكون أوليون — 1,000</text><text x="600" y="291" font-size="25">مستهلكون ثانويون — 100</text><text x="600" y="227" font-size="20">ثالثيون — 10</text></g></g><text x="600" y="518" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" fill="#eaf2eb" font-size="21">وحدات افتراضية، ليست بيانات ميدانية حقيقية</text><text x="600" y="566" fill="#deeeee" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20">قاعدة 10% تقريب تعليمي وليست كفاءة ثابتة للطبيعة</text></svg>