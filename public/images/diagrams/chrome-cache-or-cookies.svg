<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
<title>أحذف الكاش أم الكوكيز أم أغيّر الأذونات؟</title><desc>اختر أقل إجراء يعالج المشكلة بدل حذف كل البيانات</desc>
<rect width="1200" height="640" fill="#f8faf8"/>
<rect x="0" y="0" width="1200" height="12" fill="#355c87"/>
<text x="600" y="80" fill="#263c39" font-family="Tahoma,Arial,sans-serif" font-size="36" font-weight="bold" text-anchor="middle" direction="rtl">أحذف الكاش أم الكوكيز أم أغيّر الأذونات؟</text>
<text x="600" y="116" fill="#566863" font-family="Tahoma,Arial,sans-serif" font-size="19" text-anchor="middle" direction="rtl">اختر أقل إجراء يعالج المشكلة بدل حذف كل البيانات</text><rect x="50" y="182" width="230" height="230" rx="23" fill="#e9f2f6" stroke="#b4cbc5" stroke-width="2"/>
  <circle cx="165" cy="227" r="26" fill="#355c87"/><text x="165" y="236" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="bold" text-anchor="middle">1</text>
  <text x="165" y="300" fill="#2e4540" font-family="Tahoma,Arial,sans-serif" font-size="23" font-weight="bold" text-anchor="middle" direction="rtl">صورة قديمة</text>
  <text x="165" y="347" fill="#41625d" font-family="Tahoma,Arial,sans-serif" font-size="17" text-anchor="middle" direction="rtl">ابدأ بالملفات</text>
  <text x="165" y="380" fill="#41625d" font-family="Tahoma,Arial,sans-serif" font-size="17" text-anchor="middle" direction="rtl">المؤقتة فقط</text><path d="M296 295 h28" stroke="#7b9b94" stroke-width="4"/><path d="M297 284 l-12 11 12 11" stroke="#7b9b94" stroke-width="3" fill="none"/><rect x="340" y="182" width="230" height="230" rx="23" fill="#edf5ef" stroke="#b4cbc5" stroke-width="2"/>
  <circle cx="455" cy="227" r="26" fill="#355c87"/><text x="455" y="236" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="bold" text-anchor="middle">2</text>
  <text x="455" y="300" fill="#2e4540" font-family="Tahoma,Arial,sans-serif" font-size="23" font-weight="bold" text-anchor="middle" direction="rtl">تسجيل دخول</text>
  <text x="455" y="347" fill="#41625d" font-family="Tahoma,Arial,sans-serif" font-size="17" text-anchor="middle" direction="rtl">افحص بيانات</text>
  <text x="455" y="380" fill="#41625d" font-family="Tahoma,Arial,sans-serif" font-size="17" text-anchor="middle" direction="rtl">موقع واحد</text><path d="M586 295 h28" stroke="#7b9b94" stroke-width="4"/><path d="M587 284 l-12 11 12 11" stroke="#7b9b94" stroke-width="3" fill="none"/><rect x="630" y="182" width="230" height="230" rx="23" fill="#e9f2f6" stroke="#b4cbc5" stroke-width="2"/>
  <circle cx="745" cy="227" r="26" fill="#355c87"/><text x="745" y="236" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="bold" text-anchor="middle">3</text>
  <text x="745" y="300" fill="#2e4540" font-family="Tahoma,Arial,sans-serif" font-size="23" font-weight="bold" text-anchor="middle" direction="rtl">كاميرا أو إشعار</text>
  <text x="745" y="347" fill="#41625d" font-family="Tahoma,Arial,sans-serif" font-size="17" text-anchor="middle" direction="rtl">راجع أذونات</text>
  <text x="745" y="380" fill="#41625d" font-family="Tahoma,Arial,sans-serif" font-size="17" text-anchor="middle" direction="rtl">الموقع المعني</text><path d="M876 295 h28" stroke="#7b9b94" stroke-width="4"/><path d="M877 284 l-12 11 12 11" stroke="#7b9b94" stroke-width="3" fill="none"/><rect x="920" y="182" width="230" height="230" rx="23" fill="#edf5ef" stroke="#b4cbc5" stroke-width="2"/>
  <circle cx="1035" cy="227" r="26" fill="#355c87"/><text x="1035" y="236" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="bold" text-anchor="middle">4</text>
  <text x="1035" y="300" fill="#2e4540" font-family="Tahoma,Arial,sans-serif" font-size="23" font-weight="bold" text-anchor="middle" direction="rtl">تحقق ثم توقف</text>
  <text x="1035" y="347" fill="#41625d" font-family="Tahoma,Arial,sans-serif" font-size="17" text-anchor="middle" direction="rtl">اختبر العطل</text>
  <text x="1035" y="380" fill="#41625d" font-family="Tahoma,Arial,sans-serif" font-size="17" text-anchor="middle" direction="rtl">قبل حذف المزيد</text><rect x="146" y="465" width="908" height="73" rx="17" fill="#355c87"/><text x="600" y="508" fill="white" font-size="23" font-weight="bold" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" direction="rtl">احفظ النماذج وتأكد من وسيلة تسجيل الدخول أولًا</text>
 <text x="600" y="595" fill="#667b76" font-size="17" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" direction="rtl">موسوعة لوسيل — رسم توضيحي أصلي، وليس وثيقة أو شاشة رسمية</text></svg>