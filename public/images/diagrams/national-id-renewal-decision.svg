<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670"><title>تجديد بطاقة الرقم القومي</title><desc>حدد هل تغيرت البيانات قبل البدء بإجراءات التجديد</desc><rect width="1200" height="670" fill="#fafbf9"/><rect width="1200" height="12" fill="#266a67"/><text x="600" y="79" text-anchor="middle" direction="rtl" fill="#1c3e3a" font-family="Tahoma,Arial,sans-serif" font-size="35" font-weight="700">تجديد بطاقة الرقم القومي</text><text x="600" y="119" text-anchor="middle" direction="rtl" fill="#566c67" font-family="Tahoma,Arial,sans-serif" font-size="20">حدد هل تغيرت البيانات قبل البدء بإجراءات التجديد</text><rect x="35" y="182" width="244" height="279" rx="21" fill="#e9f3f0" stroke="#bbcfc9" stroke-width="2"/><circle cx="157" cy="230" r="28" fill="#266a67"/><text x="157" y="239" fill="#fff" text-anchor="middle" font-size="23" font-family="Arial,sans-serif" font-weight="700">1</text><text x="157" y="295" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="21" font-weight="700" direction="rtl" fill="#2b4945">راجع البطاقة</text><text x="157" y="354" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" direction="rtl" fill="#4f6862">الصلاحية والاسم</text><text x="157" y="391" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" direction="rtl" fill="#4f6862">والبيانات الحالية</text><path d="M285 319 h37 M286 309 l-11 10 11 10" stroke="#266a67" stroke-width="3" fill="none"/><rect x="330" y="182" width="244" height="279" rx="21" fill="#e7eff9" stroke="#bbcfc9" stroke-width="2"/><circle cx="452" cy="230" r="28" fill="#266a67"/><text x="452" y="239" fill="#fff" text-anchor="middle" font-size="23" font-family="Arial,sans-serif" font-weight="700">2</text><text x="452" y="295" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="21" font-weight="700" direction="rtl" fill="#2b4945">هل تغير شيء؟</text><text x="452" y="354" text-anchor="middle" font-family="Tahoma,Arial,sans-ser