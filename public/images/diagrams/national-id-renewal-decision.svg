iddle" fill="white" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="700" direction="rtl">وجود بيانات تغيرت؟ راجع معاملة التحديث قبل التجديد</text><text x="600" y="628" text-anchor="middle" fill="#677b77" font-family="Tahoma,Arial,sans-serif" font-size="16" direction="rtl">موسوعة لوسيل — رسم قرار تحريري أصلي لا يمثل شاشة أو وثيقة حكومية</text></svg>