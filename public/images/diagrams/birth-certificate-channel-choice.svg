<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><title>أي مسار لاستخراج شهادة الميلاد؟</title><desc>حدد حالة القيد ثم القناة وصفة مقدم الطلب</desc><rect width="1200" height="680" fill="#f9faf9"/><rect width="1200" height="12" fill="#2a6980"/><text x="600" y="76" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="38" font-weight="700" direction="rtl" fill="#263e3b">أي مسار لاستخراج شهادة الميلاد؟</text><text x="600" y="119" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20" direction="rtl" fill="#5e7771">حدد حالة القيد ثم القناة وصفة مقدم الطلب</text><rect x="35" y="179" width="245" height="283" rx="19" fill="#e7f3ef" stroke="#adc4bf" stroke-width="2"/><circle cx="157.5" cy="221" r="26" fill="#2a6980"/><text x="157.5" y="230" font-size="22" font-weight="700" text-anchor="middle" fill="white" font-family="Arial,sans-serif">1</text><text x="157.5" y="288" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="700" direction="rtl" fill="#1c4642">حدد حالة الوثيقة</text><text x="157.5" y="343" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" direction="rtl" fill="#46655f">نسخة مطبوعة سابقًا</text><text x="157.5" y="377" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" direction="rtl" fill="#46655f">أم إصدار أول؟</text><path d="M282 319 h43 M284 309 l-13 10 13 10" stroke="#2a6980" stroke-width="3" fill="none"/><rect x="330" y="179" width="245" height="283" rx="19" fill="#edf3fa" stroke="#adc4bf" stroke-width="2"/><circle cx="452.5" cy="221" r="26" fill="#2a6980"/><text x="452.5" y="230" font-size="22" font-weight="700" text-anchor="middle" fill="white" font-family="Arial,sans-serif">2</text><text x="452.5" y="288" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="700" direction="rtl" fill="#1c4642">اختر القناة</text><text x="452.5" y="343" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" direction="rtl" fill="#46655f">الأحوال المدنية</text><text x="452.5" y="377" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" direction="rtl" fill="#46655f">أو الخدمة المتاحة</text><path d="M577 319 h43 M579 309 l-13 10 13 10" stroke="#2a6980" stroke-width="3" fill="none"/><rect x="625" y="179" width="245" height="283" rx="19" fill="#fcf4e6" stroke="#adc4bf" stroke-width="2"/><circle cx="747.5" cy="221" r="26" fill="#2a6980"/><text x="747.5" y="230" font-size="22" font-weight="700" text-anchor="middle" fill="white" font-family="Arial,sans-serif">3</text><text x="747.5" y="288" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="700" direction="rtl" fill="#1c4642">راجع بيانات القيد</text><text x="747.5" y="343" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" direction="rtl" fill="#46655f">المستفيد واسم الأم</text><text x="747.5" y="377" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" direction="rtl" fill="#46655f">والصفة المقبولة</text><path d="M872 319 h43 M874 309 l-13 10 13 10" stroke="#2a6980" stroke-width="3" fill="none"/><rect x="920" y="179" width="245" height="283" rx="19" fill="#f4edf8" stroke="#adc4bf" stroke-width="2"/><circle cx="1042.5" cy="221" r="26" fill="#2a6980"/><text x="1042.5" y="230" font-size="22" font-weight="700" text-anchor="middle" fill="white" font-family="Arial,sans-serif">4</text><text x="1042.5" y="288" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="700" direction="rtl" fill="#1c4642">تسلم وتحقق</text><text x="1042.5" y="343" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" direction="rtl" fill="#46655f">راجع كل البيانات</text><text x="1042.5" y="377" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" direction="rtl" fill="#46655f">قبل الاستخدام</text><rect x="120" y="508" width="960" height="77" rx="17" fill="#2a6980"/><text x="600" y="553" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="24" font-weight="700" direction="rtl" fill="white">خطأ في أصل البيانات؟ التصحيح أولًا، ثم اطلب النسخة السليمة</text><text x="600" y="633" font-size="17" font-family="Tahoma,Arial,sans-serif" text-anchor="middle" direction="rtl" fill="#687b75">موسوعة لوسيل — رسم توضيحي تحريري، وليس نموذجًا أو شهادة رسمية</text></svg>