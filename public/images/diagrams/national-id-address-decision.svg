<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670"><title>تغيير عنوان البطاقة الشخصية</title><desc>التأكد من السكن الفعلي ونوع الإثبات قبل تقديم الطلب</desc><rect width="1200" height="670" fill="#fafbf9"/><rect width="1200" height="12" fill="#37647f"/><text x="600" y="79" text-anchor="middle" direction="rtl" fill="#1c3e3a" font-family="Tahoma,Arial,sans-serif" font-size="35" font-weight="700">تغيير عنوان البطاقة الشخصية</text><text x="600" y="119" text-anchor="middle" direction="rtl" fill="#566c67" font-family="Tahoma,Arial,sans-serif" font-size="20">التأكد من السكن الفعلي ونوع الإثبات قبل تقديم الطلب</text><rect x="35" y="182" width="244" height="279" rx="21" fill="#e9f3f0" stroke="#bbcfc9" stroke-width="2"/><circle cx="157" cy="230" r="28" fill="#37647f"/><text x="157" y="239" fill="#fff" text-anchor="middle" font-size="23" font-family="Arial,sans-serif" font-weight="700">1</text><text x="157" y="295" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="21" font-weight="700" direction="rtl" fill="#2b4945">السكن الفعلي</text><text x="157" y="354" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" direction="rtl" fill="#4f6862">حدّد العنوان</text><text x="157" y="391" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" direction="rtl" fill="#4f6862">بصيغة واضحة</text><path d="M285 319 h37 M286 309 l-11 10 11 10" stroke="#37647f" stroke-width="3" fill="none"/><rect x="330" y="182" width="244" height="279" rx="21" fill="#e7eff9" stroke="#bbcfc9" stroke-width="2"/><circle cx="452" cy="230" r="28" fill="#37647f"/><text x="452" y="239" fill="#fff" text-anchor="middle" font-size="23" font-family="Arial,sans-serif" font-weight="700">2</text><text x="452" y="295" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="21" font-weight="700" direction="rtl" fill="#2b4945">صفة الإقامة</text><text x="452" y="354" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" direction="rtl" fill="#4f6862">ملكية أو إيجار</text><text x="452" y="391" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" direction="rtl" fill="#4f6862">أو مع الأسرة؟</text><path d="M580 319 h37 M581 309 l-11 10 11 10" stroke="#37647f" stroke-width="3" fill="none"/><rect x="625" y="182" width="244" height="279" rx="21" fill="#f9f2e6" stroke="#bbcfc9" stroke-width="2"/><circle cx="747" cy="230" r="28" fill="#37647f"/><text x="747" y="239" fill="#fff" text-anchor="middle" font-size="23" font-family="Arial,sans-serif" font-weight="700">3</text><text x="747" y="295" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="21" font-weight="700" direction="rtl" fill="#2b4945">إثبات ومكتب</text><text x="747" y="354" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" direction="rtl" fill="#4f6862">تحقق من المستند</text><text x="747" y="391" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" direction="rtl" fill="#4f6862">والاختصاص المحلي</text><path d="M875 319 h37 M876 309 l-11 10 11 10" stroke="#37647f" stroke-width="3" fill="none"/><rect x="920" y="182" width="244" height="279" rx="21" fill="#f3eefa" stroke="#bbcfc9" stroke-width="2"/><circle cx="1042" cy="230" r="28" fill="#37647f"/><text x="1042" y="239" fill="#fff" text-anchor="middle" font-size="23" font-family="Arial,sans-serif" font-weight="700">4</text><text x="1042" y="295" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="21" font-weight="700" direction="rtl" fill="#2b4945">الاستلام</text><text x="1042" y="354" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" direction="rtl" fill="#4f6862">طابق العنوان</text><text x="1042" y="391" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" direction="rtl" fill="#4f6862">حدّث الجهات المعنية</text><rect x="121" y="499" width="958" height="80" rx="18" fill="#37647f"/><text x="600" y="549" text-anchor="middle" fill="white" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="700" direction="rtl">لا تفترض أن أي فاتورة أو عقد مناسب لكل حالات السكن</text><text x="600" y="628" text-anchor="middle" fill="#677b77" font-family="Tahoma,Arial,sans-serif" font-size="16" direction="rtl">موسوعة لوسيل — رسم قرار تحريري أصلي لا يمثل شاشة أو وثيقة حكومية</text></svg>