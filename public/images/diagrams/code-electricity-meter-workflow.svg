<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
<title id="t">العداد الكودي: ابدأ من حالة العقار</title><desc id="d">تقديم الطلب لا يساوي إثبات الملكية ولا الموافقة على التركيب</desc><rect width="1200" height="640" fill="#fff"/><rect width="1200" height="155" fill="#123c4f"/>
<text x="600" y="64" direction="rtl" text-anchor="middle" font-size="40" font-weight="700" font-family="Arial,Tahoma,sans-serif" fill="white">العداد الكودي: ابدأ من حالة العقار</text>
<text x="600" y="112" direction="rtl" text-anchor="middle" font-size="23" font-family="Arial,Tahoma,sans-serif" fill="#d6edf0">تقديم الطلب لا يساوي إثبات الملكية ولا الموافقة على التركيب</text>
<g font-family="Arial,Tahoma,sans-serif"><rect x="62" y="223" width="221" height="213" rx="19" fill="#edf3fb" stroke="#b9d4d7" stroke-width="2"/>
<circle cx="172" cy="267" r="26" fill="#176c73"/><text x="172" y="277" fill="white" font-size="29" font-weight="700" text-anchor="middle">1</text>
<text x="172" y="326" font-size="26" font-weight="700" fill="#193e55" text-anchor="middle" direction="rtl">حدّد الحالة</text>
<text x="172" y="375" font-size="21" text-anchor="middle" fill="#436375" direction="rtl">عداد كودي</text>
<text x="172" y="404" font-size="21" text-anchor="middle" fill="#436375" direction="rtl">أم خدمة أخرى</text></g>
<g font-family="Arial,Tahoma,sans-serif"><rect x="355" y="223" width="221" height="213" rx="19" fill="#e5f5f2" stroke="#b9d4d7" stroke-width="2"/>
<circle cx="465" cy="267" r="26" fill="#176c73"/><text x="465" y="277" fill="white" font-size="29" font-weight="700" text-anchor="middle">2</text>
<text x="465" y="326" font-size="26" font-weight="700" fill="#193e55" text-anchor="middle" direction="rtl">ادخل المنصة</text>
<text x="465" y="375" font-size="21" text-anchor="middle" fill="#436375" direction="rtl">بيانات الطلب</text>
<text x="465" y="404" font-size="21" text-anchor="middle" fill="#436375" direction="rtl">ومستنداته</text></g>
<g font-family="Arial,Tahoma,sans-serif"><rect x="648" y="223" width="221" height="213" rx="19" fill="#edf3fb" stroke="#b9d4d7" stroke-width="2"/>
<circle cx="758" cy="267" r="26" fill="#176c73"/><text x="758" y="277" fill="white" font-size="29" font-weight="700" text-anchor="middle">3</text>
<text x="758" y="326" font-size="26" font-weight="700" fill="#193e55" text-anchor="middle" direction="rtl">تابع الطلب</text>
<text x="758" y="375" font-size="21" text-anchor="middle" fill="#436375" direction="rtl">استيفاء</text>
<text x="758" y="404" font-size="21" text-anchor="middle" fill="#436375" direction="rtl">أو مقايسة</text></g>
<g font-family="Arial,Tahoma,sans-serif"><rect x="941" y="223" width="221" height="213" rx="19" fill="#e5f5f2" stroke="#b9d4d7" stroke-width="2"/>
<circle cx="1051" cy="267" r="26" fill="#176c73"/><text x="1051" y="277" fill="white" font-size="29" font-weight="700" text-anchor="middle">4</text>
<text x="1051" y="326" font-size="26" font-weight="700" fill="#193e55" text-anchor="middle" direction="rtl">تحقق من النتيجة</text>
<text x="1051" y="375" font-size="21" text-anchor="middle" fill="#436375" direction="rtl">تركيب معتمد</text>
<text x="1051" y="404" font-size="21" text-anchor="middle" fill="#436375" direction="rtl">ورقم عداد</text></g>
<g><path d="M291 334 L345 334" stroke="#176c73" stroke-width="5" fill="none"/><path d="M337 324 L348 334 L337 344" fill="none" stroke="#176c73" stroke-width="4"/></g>
<g><path d="M584 334 L638 334" stroke="#176c73" stroke-width="5" fill="none"/><path d="M630 324 L641 334 L630 344" fill="none" stroke="#176c73" stroke-width="4"/></g>
<g><path d="M877 334 L931 334" stroke="#176c73" stroke-width="5" fill="none"/><path d="M923 324 L934 334 L923 344" fill="none" stroke="#176c73" stroke-width="4"/></g>
<rect x="66" y="484" width="1068" height="87" rx="14" fill="#fff8eb" stroke="#e3c78c"/>
<text x="600" y="518" font-size="22" text-anchor="middle" font-family="Arial,Tahoma,sans-serif" direction="rtl" fill="#5b481d">عداد مؤقت للمحاسبة على الاستهلاك بحسب تعريف الشركة القابضة.</text>
<text x="600" y="549" font-size="20" text-anchor="middle" font-family="Arial,Tahoma,sans-serif" direction="rtl" fill="#5b481d">لا يُفترض أنه سند ملكية أو ترخيص بناء.</text>
<text x="600" y="616" font-size="16" text-anchor="middle" font-family="Arial,Tahoma,sans-serif" direction="rtl" fill="#71878e">رسم توضيحي أصلي من موسوعة لوسيل — ليس شاشة جهة رسمية</text></svg>