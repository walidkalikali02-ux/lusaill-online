<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><title>صورة قيد وفاة ورقي</title><desc>فرّق بين التبليغ والتصريح والقيد في نفس العام والمستخرج</desc><rect width="1200" height="680" fill="#f9fafb"/><rect width="1200" height="14" fill="#466c7b"/><text x="600" y="79" fill="#23443f" font-family="Tahoma,Arial,sans-serif" font-size="36" font-weight="700" text-anchor="middle" direction="rtl">صورة قيد وفاة ورقي</text><text x="600" y="124" fill="#5c716c" font-family="Tahoma,Arial,sans-serif" font-size="20" text-anchor="middle" direction="rtl">فرّق بين التبليغ والتصريح والقيد في نفس العام والمستخرج</text><rect x="36" y="192" width="240" height="280" rx="21" fill="#e9f1ec" stroke="#b6cdc3" stroke-width="2"/><circle cx="156" cy="241" r="27" fill="#466c7b"/><text x="156" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#fff">1</text><text x="156" y="309" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-weight="700" font-size="21" direction="rtl" fill="#294d45">مرحلة الواقعة</text><text x="156" y="359" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" direction="rtl" fill="#426058">مسجلة بالفعل؟</text><text x="156" y="395" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" direction="rtl" fill="#426058">أم لم تُبلّغ؟</text><path d="M285 322 h40 M288 311 l-13 11 13 11" stroke="#466c7b" stroke-width="3" fill="none"/><rect x="331" y="192" width="240" height="280" rx="21" fill="#ebf2fa" stroke="#b6cdc3" stroke-width="2"/><circle cx="451" cy="241" r="27" fill="#466c7b"/><text x="451" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#fff">2</text><text x="451" y="309" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-weight="700" font-size="21" direction="rtl" fill="#294d45">نوع المستخرج</text><text x="451" y="359" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" direction="rtl" fill="#426058">قيد ورقي</text><text x="451" y="395" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" direction="rtl" fill="#426058">أم شهادة مميكنة؟</text><path d="M580 322 h40 M583 311 l-13 11 13 11" stroke="#466c7b" stroke-width="3" fill="none"/><rect x="626" y="192" width="240" height="280" rx="21" fill="#fbf2e5" stroke="#b6cdc3" stroke-width="2"/><circle cx="746" cy="241" r="27" fill="#466c7b"/><text x="746" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#fff">3</text><text x="746" y="309" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-weight="700" font-size="21" direction="rtl" fill="#294d45">جهة القيد</text><text x="746" y="359" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" direction="rtl" fill="#426058">مكتب الصحة</text><text x="746" y="395" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" direction="rtl" fill="#426058">أو الأحوال المدنية</text><path d="M875 322 h40 M878 311 l-13 11 13 11" stroke="#466c7b" stroke-width="3" fill="none"/><rect x="921" y="192" width="240" height="280" rx="21" fill="#f3eef9" stroke="#b6cdc3" stroke-width="2"/><circle cx="1041" cy="241" r="27" fill="#466c7b"/><text x="1041" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#fff">4</text><text x="1041" y="309" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-weight="700" font-size="21" direction="rtl" fill="#294d45">الاستلام</text><text x="1041" y="359" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" direction="rtl" fill="#426058">راجع الاسم</text><text x="1041" y="395" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="18" direction="rtl" fill="#426058">والتاريخ والصفة</text><rect x="116" y="515" width="968" height="80" rx="18" fill="#466c7b"/><text x="600" y="567" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="22" font-weight="700" direction="rtl" fill="#fff">تصريح الدفن ليس صورة قيد وفاة ورقي ولا شهادة مميكنة</text><text x="600" y="645" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="16" direction="rtl" fill="#627d73">موسوعة لوسيل — رسم توضيحي تحريري، لا يمثل وثيقة أو شاشة حكومية</text></svg>