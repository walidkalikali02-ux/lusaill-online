t-size="17.5" direction="rtl" fill="#435e59">مميكنة أم</text><text x="450" y="392" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17.5" direction="rtl" fill="#435e59">صورة قيد ورقي</text><path d="M577 321 h42 M579 310 l-12 11 12 11" stroke="#426f60" stroke-width="3" fill="none"/><rect x="625" y="192" width="240" height="275" rx="22" fill="#fcf2e6" stroke="#bbccc6" stroke-width="2"/><circle cx="745" cy="235" r="27" fill="#426f60"/><text x="745" y="245" font-family="Arial,sans-serif" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">3</text><text x="745" y="303" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-weight="700" font-size="21" direction="rtl" fill="#26443e">الصفة والبيانات</text><text x="745" y="354" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17.5" direction="rtl" fill="#435e59">تحقق من حق الطلب</text><text x="745" y="392" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17.5" direction="rtl" fill="#435e59">واسم المتوفى</text><path d="M872 321 h42 M874 310 l-12 11 12 11" stroke="#426f60" stroke-width="3" fill="none"/><rect x="920" y="192" width="240" height="275" rx="22" fill="#f4edf7" stroke="#bbccc6" stroke-width="2"/><circle cx="1040" cy="235" r="27" fill="#426f60"/><text x="1040" y="245" font-family="Arial,sans-serif" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">4</text><text x="1040" y="303" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-weight="700" font-size="21" direction="rtl" fill="#26443e">الاستلام</text><text x="1040" y="354" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17.5" direction="rtl" fill="#435e59">افحص الاسم</text><text x="1040" y="392" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17.5" direction="rtl" fill="#435e59">والتاريخ والغرض</text><rect x="125" y="513" width="950" height="79" rx="18" fill="#426f60"/><text x="600" y="564" text-anchor="middle" 