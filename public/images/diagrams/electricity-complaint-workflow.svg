<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
<title id="t">شكوى الكهرباء: من الشركة إلى الجهاز</title><desc id="d">فرّق بين بلاغ الخطر والاعتراض المالي قبل التقديم</desc><rect width="1200" height="640" fill="#fff"/><rect width="1200" height="155" fill="#123c4f"/>
<text x="600" y="64" direction="rtl" text-anchor="middle" font-size="40" font-weight="700" font-family="Arial,Tahoma,sans-serif" fill="white">شكوى الكهرباء: من الشركة إلى الجهاز</text>
<text x="600" y="112" direction="rtl" text-anchor="middle" font-size="23" font-family="Arial,Tahoma,sans-serif" fill="#d6edf0">فرّق بين بلاغ الخطر والاعتراض المالي قبل التقديم</text>
<g font-family="Arial,Tahoma,sans-serif"><rect x="62" y="223" width="221" height="213" rx="19" fill="#edf3fb" stroke="#b9d4d7" stroke-width="2"/>
<circle cx="172" cy="267" r="26" fill="#176c73"/><text x="172" y="277" fill="white" font-size="29" font-weight="700" text-anchor="middle">1</text>
<text x="172" y="326" font-size="26" font-weight="700" fill="#193e55" text-anchor="middle" direction="rtl">صنّف المشكلة</text>
<text x="172" y="375" font-size="21" text-anchor="middle" fill="#436375" direction="rtl">عطل عاجل</text>
<text x="172" y="404" font-size="21" text-anchor="middle" fill="#436375" direction="rtl">أو اعتراض</text></g>
<g font-family="Arial,Tahoma,sans-serif"><rect x="355" y="223" width="221" height="213" rx="19" fill="#e5f5f2" stroke="#b9d4d7" stroke-width="2"/>
<circle cx="465" cy="267" r="26" fill="#176c73"/><text x="465" y="277" fill="white" font-size="29" font-weight="700" text-anchor="middle">2</text>
<text x="465" y="326" font-size="26" font-weight="700" fill="#193e55" text-anchor="middle" direction="rtl">قدّم للشركة</text>
<text x="465" y="375" font-size="21" text-anchor="middle" fill="#436375" direction="rtl">تفاصيل الواقعة</text>
<text x="465" y="404" font-size="21" text-anchor="middle" fill="#436375" direction="rtl">ورقم متابعة</text></g>
<g font-family="Arial,Tahoma,sans-serif"><rect x="648" y="223" width="221" height="213" rx="19" fill="#edf3fb" stroke="#b9d4d7" stroke-width="2"/>
<circle cx="758" cy="267" r="26" fill="#176c73"/><text x="758" y="277" fill="white" font-size="29" font-weight="700" text-anchor="middle">3</text>
<text x="758" y="326" font-size="26" font-weight="700" fill="#193e55" text-anchor="middle" direction="rtl">جهّز الأدلة</text>
<text x="758" y="375" font-size="21" text-anchor="middle" fill="#436375" direction="rtl">شكوى الشركة</text>
<text x="758" y="404" font-size="21" text-anchor="middle" fill="#436375" direction="rtl">وردّها والفواتير</text></g>
<g font-family="Arial,Tahoma,sans-serif"><rect x="941" y="223" width="221" height="213" rx="19" fill="#e5f5f2" stroke="#b9d4d7" stroke-width="2"/>
<circle cx="1051" cy="267" r="26" fill="#176c73"/><text x="1051" y="277" fill="white" font-size="29" font-weight="700" text-anchor="middle">4</text>
<text x="1051" y="326" font-size="26" font-weight="700" fill="#193e55" text-anchor="middle" direction="rtl">صعّد للجهاز</text>
<text x="1051" y="375" font-size="21" text-anchor="middle" fill="#436375" direction="rtl">نموذج رسمي</text>
<text x="1051" y="404" font-size="21" text-anchor="middle" fill="#436375" direction="rtl">ومتابعة المرجع</text></g>
<g><path d="M291 334 L345 334" stroke="#176c73" stroke-width="5" fill="none"/><path d="M337 324 L348 334 L337 344" fill="none" stroke="#176c73" stroke-width="4"/></g>
<g><path d="M584 334 L638 334" stroke="#176c73" stroke-width="5" fill="none"/><path d="M630 324 L641 334 L630 344" fill="none" stroke="#176c73" stroke-width="4"/></g>
<g><path d="M877 334 L931 334" stroke="#176c73" stroke-width="5" fill="none"/><path d="M923 324 L934 334 L923 344" fill="none" stroke="#176c73" stroke-width="4"/></g>
<rect x="66" y="484" width="1068" height="87" rx="14" fill="#fff8eb" stroke="#e3c78c"/>
<text x="600" y="518" font-size="22" text-anchor="middle" font-family="Arial,Tahoma,sans-serif" direction="rtl" fill="#5b481d">الأعطال الكهربائية العاجلة تُبلّغ عبر 121 من مكان آمن.</text>
<text x="600" y="549" font-size="20" text-anchor="middle" font-family="Arial,Tahoma,sans-serif" direction="rtl" fill="#5b481d">استلام الشكوى لا يعني الموافقة على الاعتراض.</text>
<text x="600" y="616" font-size="16" text-anchor="middle" font-family="Arial,Tahoma,sans-serif" direction="rtl" fill="#71878e">رسم توضيحي أصلي من موسوعة لوسيل — ليس شاشة جهة رسمية</text></svg>