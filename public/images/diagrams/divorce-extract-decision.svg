<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="685" viewBox="0 0 1200 685"><title>وثيقة الطلاق المميكنة والقيد الورقي</title><desc>اختر المصدر الصحيح ولا تخلط استخراج نسخة بتصحيح سجل</desc><rect width="1200" height="685" fill="#f9faf9"/><rect width="1200" height="13" fill="#536582"/><text x="600" y="80" fill="#233d38" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="35" font-weight="700" direction="rtl">وثيقة الطلاق المميكنة والقيد الورقي</text><text x="600" y="125" fill="#61766e" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20" direction="rtl">اختر المصدر الصحيح ولا تخلط استخراج نسخة بتصحيح سجل</text><rect x="35" y="192" width="240" height="275" rx="22" fill="#e9f3ef" stroke="#bbccc6" stroke-width="2"/><circle cx="155" cy="235" r="27" fill="#536582"/><text x="155" y="245" font-family="Arial,sans-serif" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">1</text><text x="155" y="303" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-weight="700" font-size="21" direction="rtl" fill="#26443e">نوع الوثيقة</text><text x="155" y="354" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17.5" direction="rtl" fill="#435e59">مميكنة أم</text><text x="155" y="392" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17.5" direction="rtl" fill="#435e59">قيد طلاق ورقي؟</text><path d="M282 321 h42 M284 310 l-12 11 12 11" stroke="#536582" stroke-width="3" fill="none"/><rect x="330" y="192" width="240" height="275" rx="22" fill="#eaf0f8" stroke="#bbccc6" stroke-width="2"/><circle cx="450" cy="235" r="27" fill="#536582"/><text x="450" y="245" font-family="Arial,sans-serif" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">2</text><text x="450" y="303" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-weight="700" font-size="21" direction="rtl" fill="#26443e">حالة القيد</text><text x="450" y="354" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17.5" direction="rtl" fill="#435e59">مسجل وصحيح</text><text x="450" y="392" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17.5" direction="rtl" fill="#435e59">أم يحتاج تصحيحًا؟</text><path d="M577 321 h42 M579 310 l-12 11 12 11" stroke="#536582" stroke-width="3" fill="none"/><rect x="625" y="192" width="240" height="275" rx="22" fill="#fcf2e6" stroke="#bbccc6" stroke-width="2"/><circle cx="745" cy="235" r="27" fill="#536582"/><text x="745" y="245" font-family="Arial,sans-serif" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">3</text><text x="745" y="303" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-weight="700" font-size="21" direction="rtl" fill="#26443e">الصفة والقناة</text><text x="745" y="354" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17.5" direction="rtl" fill="#435e59">تحقق من أهلية</text><text x="745" y="392" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17.5" direction="rtl" fill="#435e59">صاحب الطلب</text><path d="M872 321 h42 M874 310 l-12 11 12 11" stroke="#536582" stroke-width="3" fill="none"/><rect x="920" y="192" width="240" height="275" rx="22" fill="#f4edf7" stroke="#bbccc6" stroke-width="2"/><circle cx="1040" cy="235" r="27" fill="#536582"/><text x="1040" y="245" font-family="Arial,sans-serif" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">4</text><text x="1040" y="303" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-weight="700" font-size="21" direction="rtl" fill="#26443e">استلام الوثيقة</text><text x="1040" y="354" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17.5" direction="rtl" fill="#435e59">راجع الطرفين</text><text x="1040" y="392" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17.5" direction="rtl" fill="#435e59">وتاريخ الواقعة</text><rect x="125" y="513" width="950" height="79" rx="18" fill="#536582"/><text x="600" y="564" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="23" direction="rtl" font-weight="700" fill="#fff">تحديث الحالة الاجتماعية في البطاقة إجراء منفصل عند الحاجة</text><text x="600" y="641" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17" direction="rtl" fill="#647770">موسوعة لوسيل — مخطط إرشادي أصلي وليس مستندًا رسميًا</text></svg>