<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="685" viewBox="0 0 1200 685"><title>بدل فاقد بطاقة الرقم القومي</title><desc>حدد حالة البطاقة واحم معلوماتك قبل طلب البديل</desc><rect width="1200" height="685" fill="#f9faf9"/><rect width="1200" height="13" fill="#286a69"/><text x="600" y="80" fill="#233d38" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="35" font-weight="700" direction="rtl">بدل فاقد بطاقة الرقم القومي</text><text x="600" y="125" fill="#61766e" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20" direction="rtl">حدد حالة البطاقة واحم معلوماتك قبل طلب البديل</text><rect x="35" y="192" width="240" height="275" rx="22" fill="#e9f3ef" stroke="#bbccc6" stroke-width="2"/><circle cx="155" cy="235" r="27" fill="#286a69"/><text x="155" y="245" font-family="Arial,sans-serif" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">1</text><text x="155" y="303" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-weight="700" font-size="21" direction="rtl" fill="#26443e">هل فُقدت؟</text><text x="155" y="354" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17.5" direction="rtl" fill="#435e59">فقد أم تلف</text><text x="155" y="392" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17.5" direction="rtl" fill="#435e59">أم تجديد؟</text><path d="M282 321 h42 M284 310 l-12 11 12 11" stroke="#286a69" stroke-width="3" fill="none"/><rect x="330" y="192" width="240" height="275" rx="22" fill="#eaf0f8" stroke="#bbccc6" stroke-width="2"/><circle cx="450" cy="235" r="27" fill="#286a69"/><text x="450" y="245" font-family="Arial,sans-serif" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">2</text><text x="450" y="303" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-weight="700" font-size="21" direction="rtl" fill="#26443e">حماية البيانات</text><text x="450" y="354" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17.5" direction="rtl" fill="#435e59">لا تنشر صورة</text><text x="450" y="392" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17.5" direction="rtl" fill="#435e59">الهوية المفقودة</text><path d="M577 321 h42 M579 310 l-12 11 12 11" stroke="#286a69" stroke-width="3" fill="none"/><rect x="625" y="192" width="240" height="275" rx="22" fill="#fcf2e6" stroke="#bbccc6" stroke-width="2"/><circle cx="745" cy="235" r="27" fill="#286a69"/><text x="745" y="245" font-family="Arial,sans-serif" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">3</text><text x="745" y="303" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-weight="700" font-size="21" direction="rtl" fill="#26443e">القناة والإثبات</text><text x="745" y="354" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17.5" direction="rtl" fill="#435e59">اسأل عن الأوراق</text><text x="745" y="392" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17.5" direction="rtl" fill="#435e59">وصاحب الطلب</text><path d="M872 321 h42 M874 310 l-12 11 12 11" stroke="#286a69" stroke-width="3" fill="none"/><rect x="920" y="192" width="240" height="275" rx="22" fill="#f4edf7" stroke="#bbccc6" stroke-width="2"/><circle cx="1040" cy="235" r="27" fill="#286a69"/><text x="1040" y="245" font-family="Arial,sans-serif" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">4</text><text x="1040" y="303" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-weight="700" font-size="21" direction="rtl" fill="#26443e">استلام البديل</text><text x="1040" y="354" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17.5" direction="rtl" fill="#435e59">راجع البيانات</text><text x="1040" y="392" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17.5" direction="rtl" fill="#435e59">ووضع الأصل القديم</text><rect x="125" y="513" width="950" height="79" rx="18" fill="#286a69"/><text x="600" y="564" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="23" direction="rtl" font-weight="700" fill="#fff">اسأل الجهة عن المستندات عند فقد أصل البطاقة</text><text x="600" y="641" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17" direction="rtl" fill="#647770">موسوعة لوسيل — مخطط إرشادي أصلي وليس مستندًا رسميًا</text></svg>