<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="685" viewBox="0 0 1200 685"><title>بدل تالف بطاقة الرقم القومي</title><desc>متى يكون التلف سببًا لاستخراج نسخة بديلة؟</desc><rect width="1200" height="685" fill="#f9faf9"/><rect width="1200" height="13" fill="#315f81"/><text x="600" y="80" fill="#233d38" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="35" font-weight="700" direction="rtl">بدل تالف بطاقة الرقم القومي</text><text x="600" y="125" fill="#61766e" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="20" direction="rtl">متى يكون التلف سببًا لاستخراج نسخة بديلة؟</text><rect x="35" y="192" width="240" height="275" rx="22" fill="#e9f3ef" stroke="#bbccc6" stroke-width="2"/><circle cx="155" cy="235" r="27" fill="#315f81"/><text x="155" y="245" font-family="Arial,sans-serif" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">1</text><text x="155" y="303" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-weight="700" font-size="21" direction="rtl" fill="#26443e">تقييم التلف</text><text x="155" y="354" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17.5" direction="rtl" fill="#435e59">البطاقة معك</text><text x="155" y="392" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17.5" direction="rtl" fill="#435e59">لكنها متضررة</text><path d="M282 321 h42 M284 310 l-12 11 12 11" stroke="#315f81" stroke-width="3" fill="none"/><rect x="330" y="192" width="240" height="275" rx="22" fill="#eaf0f8" stroke="#bbccc6" stroke-width="2"/><circle cx="450" cy="235" r="27" fill="#315f81"/><text x="450" y="245" font-family="Arial,sans-serif" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">2</text><text x="450" y="303" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-weight="700" font-size="21" direction="rtl" fill="#26443e">حفظ الوثيقة</text><text x="450" y="354" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17.5" direction="rtl" fill="#435e59">احتفظ بالأصل</text><text x="450" y="392" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17.5" direction="rtl" fill="#435e59">والأجزاء المتاحة</text><path d="M577 321 h42 M579 310 l-12 11 12 11" stroke="#315f81" stroke-width="3" fill="none"/><rect x="625" y="192" width="240" height="275" rx="22" fill="#fcf2e6" stroke="#bbccc6" stroke-width="2"/><circle cx="745" cy="235" r="27" fill="#315f81"/><text x="745" y="245" font-family="Arial,sans-serif" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">3</text><text x="745" y="303" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-weight="700" font-size="21" direction="rtl" fill="#26443e">مستند ومركز</text><text x="745" y="354" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17.5" direction="rtl" fill="#435e59">أبرز الأصل</text><text x="745" y="392" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17.5" direction="rtl" fill="#435e59">واستفسر عن الحالة</text><path d="M872 321 h42 M874 310 l-12 11 12 11" stroke="#315f81" stroke-width="3" fill="none"/><rect x="920" y="192" width="240" height="275" rx="22" fill="#f4edf7" stroke="#bbccc6" stroke-width="2"/><circle cx="1040" cy="235" r="27" fill="#315f81"/><text x="1040" y="245" font-family="Arial,sans-serif" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">4</text><text x="1040" y="303" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-weight="700" font-size="21" direction="rtl" fill="#26443e">فحص البديل</text><text x="1040" y="354" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17.5" direction="rtl" fill="#435e59">تأكد من وضوح</text><text x="1040" y="392" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17.5" direction="rtl" fill="#435e59">البيانات وصحتها</text><rect x="125" y="513" width="950" height="79" rx="18" fill="#315f81"/><text x="600" y="564" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="23" direction="rtl" font-weight="700" fill="#fff">إذا انتهت الصلاحية أو تغيّرت البيانات فاسأل عن المسار الصحيح</text><text x="600" y="641" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-size="17" direction="rtl" fill="#647770">موسوعة لوسيل — مخطط إرشادي أصلي وليس مستندًا رسميًا</text></svg>