name: Render Impossible Museum hero media
on:
  push:
    branches:
      - feat/impossible-museum-hero
    paths:
      - scripts/render-impossible-museum.py
      - .github/workflows/impossible-museum-assets.yml

permissions:
  contents: write

concurrency:
  group: museum-media-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Render procedural architecture
        run: |
          python -m pip install "numpy==1.26.4" "opencv-python-headless==4.10.0.84"
          python scripts/render-impossible-museum.py
      - name: Install FFmpeg encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Encode browser-compatible video
        run: |
          ffmpeg -hide_banner -loglevel error -y -i public/museum/hero-raw.mp4 -an -c:v libx264 -preset veryfast -crf 27 -pix_fmt yuv420p -movflags +faststart public/museum/hero.mp4
          rm public/museum/hero-raw.mp4
          test -s public/museum/hero.mp4
          test -s public/museum/poster.jpg
      - name: Commit rendered assets to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/museum/hero.mp4 public/museum/poster.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add generated Impossible Museum MP4 and poster"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
