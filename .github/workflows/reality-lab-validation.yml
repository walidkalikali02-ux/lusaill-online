name: Reality Lab validation
on:
  pull_request:
    paths:
      - "app/reality-lab/**"
      - "app/api/reality-lab/**"
      - "lib/reality-lab/**"
      - "scripts/test-reality-lab.mjs"
      - "package.json"
      - ".github/workflows/reality-lab-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lab:test
      - run: npx tsc --noEmit
